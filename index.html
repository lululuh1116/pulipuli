<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FAF5EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PuliPuli.Studio 記帳</title>
<style>
:root{
  --cream:#FAF5EE;
  --milk:#F3EAE0;
  --card:#FFFFFF;
  --line:#EDE2D4;
  --brown:#5C4633;
  --brown-2:#7A6450;
  --brown-soft:#A08C77;
  --accent:#C9A176;
  --accent-deep:#A87E52;
  --pink:#E9CFC3;
  --pink-deep:#D3A593;
  --red:#C25E52;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:12px;
  --shadow:0 6px 20px rgba(92,70,51,.08);
  --shadow-sm:0 3px 10px rgba(92,70,51,.07);
  /* 新預設：背景深夜藍、按鈕薰衣草藍、文字深藍黑 */
  --cream:#3A3E6C;
  --btn:#8387C3;
  --btn-text:#FFF9F2;
  --ink-title:#0A1123;
  --ink-body:#0A1123;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--cream);
  color:var(--ink-body,var(--brown));
  font-size:15px;
  line-height:1.55;
  letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}


.page>.note-mini{color:var(--on-bg-soft,var(--brown-soft))}

.combo-input{display:inline-flex;align-items:stretch;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);box-shadow:var(--shadow-sm)}
.combo-input input{border:none!important;box-shadow:none!important;border-radius:0!important;background:transparent!important;margin:0!important;outline:none!important}
.combo-input input:first-child{border-right:1.5px solid var(--line)!important}
.combo-input input:focus{background:var(--milk)!important}
.rep-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 12px}
.rep-nav #repPerLabel{font-weight:800;font-size:15px;color:var(--on-bg,var(--ink-title));min-width:130px;text-align:center}
.sched-preview-tag{font-size:11px;color:var(--brown-soft);background:var(--milk);border-radius:999px;padding:5px 12px;display:inline-block;margin-bottom:12px}
/* ===== RWD：網頁版單純加寬，排版與手機相同 ===== */
@media(min-width:768px){
  main{max-width:720px}
  header.app>*{max-width:720px;margin-left:auto;margin-right:auto}
  .sheet{max-width:640px}
}

/* ===== 頂部 ===== */
header.app{
  position:sticky;top:0;z-index:30;
  background:var(--header-bg,rgba(250,245,238,.92));
  backdrop-filter:blur(10px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
}
.brand-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand .brand-text{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
#brandLogo{
  width:44px;height:44px;border-radius:50%;flex:none;
  background:var(--btn) center/contain no-repeat;color:var(--btn-text);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;box-shadow:var(--shadow-sm);
  border:2px solid rgba(255,255,255,.55);
}
#brandLogo.has-img{background-color:#FFFFFF}
.brand h1{font-size:18px;font-weight:800;letter-spacing:.04em;color:var(--on-bg,var(--ink-title))}
.brand .sub{font-size:11px;color:var(--on-bg-soft,var(--brown-soft))}
.head-actions{display:flex;align-items:center;gap:10px}
.sync-dot{width:12px;height:12px;background:#CFC4B5;display:inline-block;clip-path:polygon(50% 0%,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0% 50%,38% 38%)}
.sync-dot.ok{background:#9DBB8F}
.sync-dot.busy{background:var(--accent);animation:pulse 1s infinite}
.sync-dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.gear-btn{font-size:24px;width:48px;height:48px;border-radius:50%;background:var(--milk);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}

/* 快選列 */
nav.quick{
  display:flex;gap:6px;margin-top:10px;
  background:var(--milk);border-radius:999px;padding:4px;
}
nav.quick button{
  flex:1;padding:9px 0;border-radius:999px;font-size:14px;font-weight:600;color:var(--brown-2);
  transition:background .2s,color .2s;
}
nav.quick button.on{background:var(--btn,var(--brown));color:var(--btn-text,var(--cream));box-shadow:var(--shadow-sm)}

main{padding:14px 16px 120px;max-width:560px;margin:0 auto}
.page{display:none}
.page.on{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card-bg,var(--card));border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{font-size:14px;font-weight:700;color:var(--ink-title,var(--brown-2));margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* ===== 月曆 ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .ttl{font-size:17px;font-weight:800;letter-spacing:.06em}
.cal-nav{width:38px;height:38px;border-radius:50%;background:var(--milk);font-size:16px;color:var(--brown-2)}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-week span{text-align:center;font-size:11px;color:var(--brown-soft);padding:4px 0 8px}
.cal-grid button.day{
  position:relative;height:48px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.cal-grid button.day:active{background:var(--milk)}
.day .num{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;
  transition:background .15s,color .15s;
}
.day.today .num{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.sel .num{background:var(--btn,var(--brown));color:var(--btn-text,var(--cream))}
.day .dots{display:flex;gap:3px;height:4px}
.day .dots i{width:4px;height:4px;border-radius:50%}
.day .dots i.in{background:var(--in-deep,var(--accent-deep))}
.day .dots i.ex{background:var(--ex-main,var(--pink-deep))}
.day .dots i.bk{background:var(--bk-dot,#9DBB8F)}
.day.dim{opacity:.28}

/* 當日收支方框 */
.day-panel{min-height:120px}
.day-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#dayCfgBar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#dayCfgBar .mini-btn{padding:6px 10px;font-size:12px}
.day-panel .empty{color:var(--brown-soft);font-size:13px;text-align:center;padding:26px 0}
.rec-li{
  display:flex;align-items:center;gap:10px;
  padding:10px 2px;border-bottom:1px dashed var(--line);
}
.rec-li:last-child{border-bottom:none}
.rec-li .ic{
  width:34px;height:34px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.rec-li .ic.in{background:var(--in-bg,#F0E5D3)}
.rec-li .ic.ex{background:var(--ex-bg,#F4E2DA)}
.rec-li .body{flex:1;min-width:0}
.rec-li .t1{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-li .t2{font-size:11.5px;color:var(--brown-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-li .amt{font-weight:800;font-size:14.5px;white-space:nowrap}
.rec-li .amt.in{color:var(--in-deep,var(--brown))}
.rec-li .amt.ex{color:var(--red)}
.rec-li .del{font-size:15px;padding:6px;opacity:.65}

/* FAB */
.fab{
  position:fixed;right:20px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:25;
  width:58px;height:58px;border-radius:50%;
  background:var(--btn,var(--brown));color:var(--btn-text,var(--cream));font-size:28px;font-weight:300;
  box-shadow:0 10px 24px rgba(92,70,51,.35);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.fab:active{transform:scale(.92)}

/* ===== 膠囊列 ===== */
.pill-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.pill-scroll::-webkit-scrollbar{display:none}
.pill{
  flex:none;padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:600;
  background:var(--card);color:var(--brown-2);box-shadow:var(--shadow-sm);
  transition:background .15s,color .15s;
}
.pill.on{background:var(--btn,var(--brown));color:var(--btn-text,var(--cream))}

/* ===== 總紀錄 ===== */
.rec-day-h{font-size:12.5px;font-weight:700;color:var(--brown-soft);margin:14px 2px 4px;letter-spacing:.05em}
.rec-day-h:first-child{margin-top:2px}

/* 底部懸浮總價欄（總紀錄頁） */
.week-total{
  position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;
  max-width:528px;margin:0 auto;
  background:var(--card);border-radius:var(--r-lg);box-shadow:0 10px 28px rgba(92,70,51,.18);
  padding:14px 18px;display:none;align-items:center;justify-content:space-between;
}
.week-total.show{display:flex}
.week-total .lab{font-size:13px;color:var(--brown-soft);font-weight:600}
.week-total .val{font-size:20px;font-weight:800;color:var(--brown)}
.week-total .val.neg{color:var(--red)}

/* ===== 報表 ===== */
.chart-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.legend{display:flex;flex-direction:column;gap:6px;min-width:140px}
.legend .lg{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .lg i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .lg b{margin-left:auto;font-weight:700}
.kpi{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.kpi .big{font-size:34px;font-weight:800;line-height:1.1}
.kpi .unit{font-size:13px;color:var(--brown-soft)}
.kpi-sub{display:flex;gap:18px;margin-top:10px;font-size:12.5px;color:var(--brown-soft)}
.kpi-sub b{color:var(--brown);font-weight:700}
.note-mini{font-size:11.5px;color:var(--brown-soft);margin-top:8px}
.bars{width:100%}

/* ===== Bottom Sheet ===== */
.sheet-mask{
  position:fixed;inset:0;background:rgba(70,52,36,.35);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--sheet,#FAF6EF);
  border-radius:26px 26px 0 0;
  max-height:88vh;max-width:560px;margin:0 auto;
  display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,.33,1);
  box-shadow:0 -8px 40px rgba(92,70,51,.25);
}
.sheet.show{transform:none}
#schedPrevModal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
#schedPrevModal.show{display:flex}
#schedPrevModal .sp-inner{background:var(--card);border-radius:20px;max-width:420px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.3);overflow:hidden}
#schedPrevModal .sp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
#schedPrevModal .sp-imgwrap{flex:1;overflow:auto;padding:14px;background:var(--milk);display:flex;justify-content:center}
#schedPrevModal .sp-imgwrap img{max-width:100%;height:auto;border-radius:10px;box-shadow:var(--shadow-sm);align-self:flex-start}
#schedPrevModal .sp-foot{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
#colorEditorMask{z-index:59}
.editor-head{display:flex;align-items:center;gap:8px}
.sheet-grip{width:42px;height:5px;border-radius:99px;background:var(--line);margin:10px auto 4px;flex:none}
.sheet-head{padding:4px 18px 10px;flex:none}
.sheet-body{overflow-y:auto;padding:0 18px 16px;-webkit-overflow-scrolling:touch}
.seg{
  display:flex;background:var(--milk);border-radius:999px;padding:4px;margin-top:6px;
}
.seg button{flex:1;padding:9px 0;border-radius:999px;font-size:14px;font-weight:700;color:var(--brown-2)}
.seg button.on.in{background:var(--btn,var(--brown));color:var(--btn-text,var(--cream))}
.seg button.on.ex{background:var(--ex-main,var(--pink-deep));color:#fff}
.seg button.on.bk{background:var(--bk-main,#8FAE81);color:#fff}
.rec-li .ic.bk{background:var(--bk-bg,#EAF1E6)}
.rec-li .amt.bk{color:var(--bk-main,#7E9A70);font-size:12px;font-weight:700}
.checkout-btn{
  padding:7px 12px;border-radius:999px;background:var(--bk-main,#8FAE81);color:#fff;
  font-size:12px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow-sm);
}
.sheet-date{text-align:center;font-size:12.5px;color:var(--brown-soft);margin-top:8px}

.blk{margin-top:14px}
.blk .blk-t{font-size:13px;font-weight:700;color:var(--brown-2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:600;
  background:var(--card);box-shadow:var(--shadow-sm);color:var(--brown-2);
  transition:background .15s,color .15s;
}
.chip small{font-weight:500;opacity:.7;margin-left:4px;font-size:11px}
.chip.on{background:var(--brown);color:#FFF9F2}
.chip.on small{opacity:.85}
.chip.ex-on{background:var(--pink-deep);color:#fff}
.inline-input{
  border:1.5px solid var(--line);border-radius:12px;background:var(--card);
  padding:8px 12px;font-size:14px;width:120px;
}
.inline-input.wide{width:100%}

/* 計算機 */
.calc{margin-top:10px}
.calc-disp{
  background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow-sm);
  padding:12px 16px;text-align:right;font-size:22px;font-weight:700;letter-spacing:.04em;
  min-height:52px;word-break:break-all;
}
.calc-disp .ph{color:var(--brown-soft);font-size:15px;font-weight:500}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.calc-keys button{
  padding:13px 0;border-radius:var(--r-md);background:var(--card);box-shadow:var(--shadow-sm);
  font-size:18px;font-weight:600;
}
.calc-keys button:active{background:var(--milk)}
.calc-keys .op{background:var(--milk);color:var(--accent-deep)}
.calc-keys .danger{color:var(--red);font-size:15px}

/* 懸浮總價欄（Sheet 內 Sticky Footer） */
.sheet-foot{
  flex:none;padding:12px 18px calc(14px + env(safe-area-inset-bottom));
  background:var(--card);border-radius:22px 22px 0 0;
  box-shadow:0 -4px 18px rgba(92,70,51,.10);
  display:flex;align-items:center;gap:14px;
}
.sheet-foot .total{flex:1}
.sheet-foot .total .lab{font-size:11.5px;color:var(--brown-soft)}
.sheet-foot .total .val{font-size:24px;font-weight:800}
.sheet-foot .total .val.ex{color:var(--red)}
.ok-btn{
  padding:13px 34px;border-radius:999px;background:var(--btn,var(--brown));color:var(--btn-text,var(--cream));
  font-size:16px;font-weight:800;letter-spacing:.15em;
  box-shadow:0 6px 16px rgba(92,70,51,.3);
}
.ok-btn:disabled{opacity:.35;box-shadow:none}
.ok-btn.ex{background:var(--ex-main,var(--pink-deep))}

/* 後台設定 / 同步設定 */
.fold-t{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  font-size:13px;font-weight:700;color:var(--brown-soft);padding:14px 0 6px;
}
.fold-t .arr{transition:transform .2s}
.fold-t.open .arr{transform:rotate(180deg)}
.fold-body{display:none;padding-bottom:8px}
.fold-body.open{display:block}
.opt-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.opt-row .nm{flex:1}
.opt-row .pr{color:var(--brown-soft);font-size:12.5px}
.opt-row .rm{color:var(--red);padding:4px 8px;font-size:13px}
.opt-add{display:flex;gap:6px;margin-top:8px}
.opt-add input{flex:1;min-width:0}
.opt-add input.price{flex:none;width:84px}
.mini-btn{
  padding:8px 14px;border-radius:12px;background:var(--milk);font-size:13px;font-weight:700;color:var(--brown-2);flex:none;
}
.mini-btn.solid{background:var(--btn,var(--brown));color:var(--btn-text,var(--cream))}
.field{margin-top:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--brown-2);margin-bottom:5px}
.field .row{display:flex;gap:8px}
.sync-status{
  margin-top:12px;padding:10px 14px;border-radius:var(--r-md);background:var(--milk);
  font-size:13px;display:flex;align-items:center;gap:8px;
}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{
  position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);
  background:var(--brown);color:#FFF9F2;font-size:13.5px;font-weight:600;
  padding:10px 20px;border-radius:999px;z-index:99;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;white-space:nowrap;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="bgLayer" style="position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;pointer-events:none"></div>

<header class="app">
  <div class="brand-row">
    <div class="brand"><span id="brandLogo"></span><span class="brand-text"><h1 id="brandName">PuliPuli.Studio</h1><span class="sub">美甲記帳</span></span></div>
    <div class="head-actions">
      <span class="sync-dot" id="syncDot" title="同步狀態"></span>
      <button class="gear-btn" id="gearBtn" aria-label="設定">⚙︎</button>
    </div>
  </div>
  <nav class="quick" role="tablist">
    <button id="navCal" class="on">月　曆</button>
    <button id="navSched">預約表</button>
    <button id="navRec">總紀錄</button>
    <button id="navRep">報　表</button>
  </nav>
</header>

<main>
  <!-- 頁面 1：月曆 -->
  <section class="page on" id="pageCal">
    <div id="bkNotice"></div>
    <div class="card">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" aria-label="上個月">‹</button>
        <div class="ttl" id="calTitle"></div>
        <button class="cal-nav" id="calNext" aria-label="下個月">›</button>
      </div>
      <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="card day-panel">
      <div class="day-panel-head">
        <h3 id="dayPanelTitle" style="margin-bottom:0">當日收支</h3>
        <div id="dayCfgBar"></div>
      </div>
      <div id="dayList"></div>
    </div>
  </section>

  <!-- 頁面：IG 預約表 -->
  <section class="page" id="pageSched">
    <div class="card">
      <div class="sched-preview-tag" id="schedPreviewTag"></div>
      <div class="cal-head">
        <button class="cal-nav" id="schedPrev" aria-label="上個月">‹</button>
        <div class="ttl" id="schedTitle"></div>
        <button class="cal-nav" id="schedNext" aria-label="下個月">›</button>
      </div>
      <div id="schedPreview"></div>
    </div>
    <button class="ok-btn" id="schedBtn" style="width:100%">產生本月 IG 預約表預覽圖</button>
    <div class="card" style="margin-top:14px">
      <button class="fold-t" id="schedCfgT"><span>⚙︎ 預約表設定（時段・說明文字・背景）</span><span class="arr">▾</span></button>

/* 色彩工具 */
function normHex(v){
  if(!v)return null;
  let h=String(v).trim().replace(/^#/,'');
  if(/^[0-9a-fA-F]{3}$/.test(h))h=h.split('').map(c=>c+c).join('');
  if(/^[0-9a-fA-F]{6}$/.test(h))return '#'+h.toUpperCase();
  return null;
}
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgb2hex(r,g,b){const f=v=>('0'+Math.round(Math.max(0,Math.min(255,v))).toString(16)).slice(-2);return ('#'+f(r)+f(g)+f(b)).toUpperCase();}
function mixHex(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
const lightenHex=(c,t)=>mixHex(c,'#FFFFFF',t);
const darkenHex=(c,t)=>mixHex(c,'#000000',t);
/* 五色快速生成整套 */

    accent:lightenHex(btn,.25), accentDeep:darkenHex(btn,.15),
    inBg:lightenHex(btn,.85), inDeep:darkenHex(btn,.15),
    exMain:mixHex(btn,pop,.5), exBg:lightenHex(mixHex(btn,pop,.5),.82), exDeep:darkenHex(mixHex(btn,pop,.5),.15),
    bk:pop, bkDot:pop, bkBg:lightenHex(pop,.82), bkLine:lightenHex(pop,.62),
    cover:lightenHex(pop,.45), barOn:darkenHex(btn,.15), barOff:lightenHex(btn,.72),
    pieIn:btn, pieEx:mixHex(btn,pop,.5),
    pie:[btn,pop,soft,mixHex(btn,pop,.5),darkenHex(btn,.18),lightenHex(pop,.25),lightenHex(btn,.28),mixHex(soft,text,.3)],
    deco:[btn,pop,soft,lightenHex(btn,.28),lightenHex(pop,.25)]

}

  if(!m)return '';
  const n=parseInt(m[1],16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return (r*0.299+g*0.587+b*0.114)>165?'#5C4633':'#FFF9F2';
}
function saveTheme(){
  /* 配色 → 雲端同步；字體與背景圖只存本機 */
  opts.look={set:theme.set,customSets:customSets(),cardAlpha:(opts.look&&opts.look.cardAlpha!=null)?opts.look.cardAlpha:1};

function hexToRgba(hex,a){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');
  if(!m)return 'rgba(250,245,238,'+a+')';
  const n=parseInt(m[1],16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

function recTitle(r){
  if(r.type==='booking')return (r.time?r.time+'　':'')+r.name;
  if(r.type==='income'){
    const base=r.breakdown&&r.breakdown.base?r.breakdown.base.name:'收入';
    const extra=(r.breakdown&&r.breakdown.addons&&r.breakdown.addons.length)?'＋'+r.breakdown.addons.length+'項加價':'';
    const bkT=r.bkTime?'🕒'+r.bkTime+' ':'';
    return bkT+base+extra;
  }
  return r.category||'支出';
}
function recSub(r){
  if(r.type==='booking'){
    const parts=[];
    if(r.channel)parts.push(r.channel+'預約');
    const pl=r.plans||(r.plan?[r.plan]:[]);
    if(pl.length)parts.push(pl.map(p=>p.name).join('＋'));
    if(r.planNote)parts.push(r.planNote);
    if(r.deposit>0)parts.push('訂金$'+r.deposit);
    return parts.join('・')||'待結帳';
  }
  if(r.type==='income'){
    const parts=[];
    if(r.breakdown){
      if(r.breakdown.removal)parts.push(r.breakdown.removal.name);
      if(r.breakdown.addons)r.breakdown.addons.forEach(a=>parts.push(a.name));
    }
    if(r.discount&&r.discount.label)parts.push(r.discount.label);
    if(r.note)parts.push(r.note);
    return parts.join('・')||'基礎服務';
  }
  const parts=(r.items||[]).slice();
  if(r.note)parts.push(r.note);
  return parts.join('・')||'—';
}

function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x;}
let selWeek=weekStart(today).getTime();

function renderRec(){
  const pills=$('#weekPills'); pills.innerHTML='';
  const cur=weekStart(today).getTime();
  let min=cur;
  live().forEach(r=>{const t=weekStart(new Date(r.date+'T00:00:00')).getTime();if(t<min)min=t;});
  const weeks=[];
  for(let t=cur+7*864e5*4; t>=min; t-=7*864e5)weeks.push(t);
  weeks.sort((a,b)=>a-b);
  let selBtn=null;
  weeks.forEach(t=>{
    const s=new Date(t), e=new Date(t+6*864e5);
    const b=document.createElement('button');
    b.className='pill'+(t===selWeek?' on':'');
    b.textContent=(t===cur?'本週 ':'')+(s.getMonth()+1)+'/'+s.getDate()+'–'+(e.getMonth()+1)+'/'+e.getDate();
    b.onclick=()=>{selWeek=t;renderRec();};
    pills.appendChild(b);
    if(t===selWeek)selBtn=b;
  });
  if(selBtn)requestAnimationFrame(()=>selBtn.scrollIntoView({inline:'center',block:'nearest'}));

  const list=$('#recList'); list.innerHTML='';
  const s=selWeek, e=selWeek+7*864e5;
  let total=0, any=false, todayHdr=null;
  for(let t=s;t<e;t+=864e5){
    const ds=fmtD(new Date(t));
    const rs=live().filter(r=>r.date===ds).sort((a,b)=>a.updatedAt-b.updatedAt);
    if(!rs.length)continue;
    any=true;
    const d=new Date(t);
    const h=document.createElement('div'); h.className='rec-day-h';
    h.textContent=(d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）'+(ds===fmtD(today)?'・今天':'');
    list.appendChild(h);
    if(ds===fmtD(today))todayHdr=h;
    rs.forEach(r=>{
      total+=r.type==='income'?r.amount:r.type==='expense'?-r.amount:0;
      list.appendChild(recLi(r,false));
    });
  }
  if(!any)list.innerHTML='<div class="empty" style="color:var(--brown-soft);font-size:13px;text-align:center;padding:26px 0">這一週沒有任何紀錄</div>';
  const tv=$('#weekTotalVal');
  tv.textContent=money(total);
  tv.classList.toggle('neg',total<0);
  $('#weekTotalLab').textContent=(selWeek===cur?'本週合計':'當週合計');

}

function pieSVG(data,size){
  size=size||170;
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total<=0)return '<div class="empty" style="color:var(--brown-soft);font-size:13px;padding:18px 0">此期間尚無資料</div>';
  const cx=size/2,cy=size/2,R=size/2-2,r=R*0.55;
  let a0=-Math.PI/2, paths='';
  const nz=data.filter(d=>d.value>0);
  if(nz.length===1){
    paths='<circle cx="'+cx+'" cy="'+cy+'" r="'+((R+r)/2)+'" fill="none" stroke="'+nz[0].color+'" stroke-width="'+(R-r)+'"/>';
  }else{
    data.forEach(d=>{
      if(d.value<=0)return;
      const a1=a0+d.value/total*2*Math.PI;
      const large=(a1-a0)>Math.PI?1:0;
      const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0);
      const x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
      const x2=cx+r*Math.cos(a1),y2=cy+r*Math.sin(a1);
      const x3=cx+r*Math.cos(a0),y3=cy+r*Math.sin(a0);
      paths+='<path d="M'+x0.toFixed(2)+' '+y0.toFixed(2)+
        ' A'+R+' '+R+' 0 '+large+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+
        ' L'+x2.toFixed(2)+' '+y2.toFixed(2)+
        ' A'+r+' '+r+' 0 '+large+' 0 '+x3.toFixed(2)+' '+y3.toFixed(2)+
        ' Z" fill="'+d.color+'"/>';
      a0=a1;
    });
  }
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img">'+paths+'</svg>';
}
function legendHTML(data,total){
  return '<div class="legend">'+data.map(d=>{
    const pct=total>0?Math.round(d.value/total*100):0;
    return '<div class="lg"><i style="background:'+d.color+'"></i>'+esc(d.label)+'<b>'+money(d.value)+'（'+pct+'%）</b></div>';
  }).join('')+'</div>';
}

function renderRep(){
  const per=periodFilter();
  $('#repPerLabel').textContent=per.label;
  const isCur=(repPer==='day'&&fmtD(repDate)===fmtD(today))||
    (repPer==='month'&&repDate.getFullYear()===today.getFullYear()&&repDate.getMonth()===today.getMonth())||
    (repPer==='year'&&repDate.getFullYear()===today.getFullYear());
  $('#repToday').style.display=isCur?'none':'';
  const rs=live().filter(per.test);
  const inSum=rs.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
  const exSum=rs.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);

  /* 收支圓餅 */
  $('#repPieTitle').textContent=per.label+'・收支圓餅圖';
  const pieData=[{label:'收入',value:inSum,color:curSet().pieIn},{label:'支出',value:exSum,color:curSet().pieEx}];
  $('#repPie').innerHTML=pieSVG(pieData)+( (inSum+exSum)>0 ? legendHTML(pieData,inSum+exSum)+
    '<div style="width:100%;text-align:center;font-size:13px;color:var(--brown-soft)">淨額 <b style="color:'+(inSum-exSum<0?'var(--red)':'var(--brown)')+';font-size:16px">'+money(inSum-exSum)+'</b></div>' : '');

  /* 客單價 */
  const visits=rs.filter(r=>r.type==='income').length;

  const max=Math.max.apply(null,counts.concat([1]));
  const W=320,H=150,bw=W/12;

  counts.forEach((c,i)=>{

/* 24H 制、分鐘 10 分間隔的時間選擇器 */
function timeSelects(val,onChange){
  const wrap=document.createElement('span');
  wrap.style.cssText='display:inline-flex;gap:4px;align-items:center';
  const hs=document.createElement('select'); hs.className='inline-input'; hs.style.cssText='width:88px;text-align:center';
  const ms=document.createElement('select'); ms.className='inline-input'; ms.style.cssText='width:88px;text-align:center';
  let hOpts='<option value="">-- 時</option>';
  for(let h=0;h<24;h++)hOpts+='<option value="'+pad(h)+'">'+pad(h)+'</option>';
  hs.innerHTML=hOpts;
  const MINS=['00','10','20','30','40','50'];
  ms.innerHTML=MINS.map(m=>'<option value="'+m+'">'+m+'</option>').join('');
  const m0=/^(\d{1,2}):(\d{2})$/.exec(val||'');
  if(m0){
    hs.value=pad(+m0[1]);
    if(!MINS.includes(m0[2]))ms.innerHTML+='<option value="'+m0[2]+'">'+m0[2]+'</option>';
    ms.value=m0[2];
  }
  const colon=document.createElement('b'); colon.textContent='：';
  const upd=()=>onChange(hs.value===''?'':hs.value+':'+ms.value);
  hs.onchange=upd; ms.onchange=upd;
  wrap.appendChild(hs); wrap.appendChild(colon); wrap.appendChild(ms);
  return wrap;
}

const dayCfg=ds=>opts.sched.days[ds]||null;
const isOffDay=ds=>{const c=dayCfg(ds);return !!(c&&c.off);};
function effSlots(ds){
  const c=dayCfg(ds);
  if(c&&c.off)return [];
  if(c&&c.slots)return c.slots.slice().sort();
  return opts.sched.slots.slice().sort();
}

function openEntry(rec){
  editingId=rec?rec.id:null;
  editDate=rec?rec.date:selDate;

  checkoutBkInfo=(rec&&rec.type==='income'&&rec.bkTime)

/* 把既有收入紀錄還原成表單狀態 */
function prefillIncome(r){
  const bd=r.breakdown||{};
  const findBy=(arr,it)=>arr.find(o=>o.name===it.name&&o.price===it.price)||arr.find(o=>o.name===it.name);
  /* [FIX] 補上 extraName、monthlyName，避免編輯後按 OK 時 undefined.trim() 閃退 */
  inSel={base:null,addons:[],extra:'',extraName:'',removal:null,freeRemoval:false,pct:null,fixed:null,custom:'',note:r.note||'',customer:r.customer||'',monthly:'',monthlyName:''};
  exSel={cat:Object.keys(opts.expCats)[0],items:[],other:'',note:''};
  calcExpr='';
  if(bd.base){
    /* [FIX] 原本的 else-if 條件與 hit 重複，第三分支永遠不會執行；
       改為：優惠款（isMonthly 旗標或舊資料名稱判斷）回填優惠欄位，
       其餘服務找不到清單時顯示「（已停用）」chip 保留原價 */
    if(bd.base.isMonthly||bd.base.name==='當月優惠款'){
      inSel.monthly=String(bd.base.price);
      inSel.monthlyName=(bd.base.name==='當月優惠款')?'':bd.base.name;
    }else{
      inSel.base=findBy(opts.base,bd.base)||{id:'x_'+uid(),name:bd.base.name,price:bd.base.price};
    }
  }
  (bd.addons||[]).forEach(a=>{
    if(a.isExtra||a.name==='款式加價'){inSel.extra=String(a.price);inSel.extraName=(a.name==='款式加價')?'':a.name;return;}
    inSel.addons.push(findBy(opts.addon,a)||{id:'x_'+uid(),name:a.name,price:a.price});
  });
  if(bd.removal){
    const m=findBy(opts.removal,bd.removal);
    inSel.removal=m||{id:'x_'+uid(),name:bd.removal.name,price:bd.removal.price};
  }
  if(r.discount){
    if(r.discount.pct)inSel.pct=r.discount.pct;
    if(r.discount.fixed)inSel.fixed=r.discount.fixed;
    if(r.discount.custom)inSel.custom=String(r.discount.custom);
    if(/新客免費卸甲/.test(r.discount.label||''))inSel.freeRemoval=true;
  }
}

/* 把既有支出紀錄還原成表單狀態 */
function prefillExpense(r){
  const cat=opts.expCats[r.category]?r.category:Object.keys(opts.expCats)[0];
  const known=opts.expCats[cat]||[];
  const items=[],others=[];
  (r.items||[]).forEach(n=>known.includes(n)?items.push(n):others.push(n));
  inSel={base:null,addons:[],extra:'',extraName:'',removal:null,freeRemoval:false,pct:null,fixed:null,custom:'',note:'',customer:'',monthly:'',monthlyName:''};
  exSel={cat:cat,items:items,other:others.join('、'),note:r.note||''};
  calcExpr=String(r.amount);
}

function incomeTotal(){
  let sub=0;
  if(inSel.base)sub+=inSel.base.price;
  else{const mo=parseFloat(inSel.monthly);if(!isNaN(mo)&&mo>=0)sub+=mo;}
  inSel.addons.forEach(a=>sub+=a.price);
  const ex=parseFloat(inSel.extra);
  if(!isNaN(ex)&&ex>0)sub+=ex;
  if(inSel.removal&&!inSel.freeRemoval)sub+=inSel.removal.price;
  let t=sub;
  if(inSel.pct)t=t*inSel.pct;
  if(inSel.fixed)t-=inSel.fixed;
  const c=parseFloat(inSel.custom);
  if(!isNaN(c)&&c>0)t-=c;
  return Math.max(0,Math.round(t));
}
function calcTotal(){
  if(!calcExpr)return 0;
  const tokens=calcExpr.match(/\d+(?:\.\d+)?|[+\-]/g)||[];
  let total=0,op='+';
  tokens.forEach(t=>{
    if(t==='+'||t==='-'){op=t;return;}
    const n=parseFloat(t);
    total=op==='+'?total+n:total-n;
  });
  return Math.round(total*100)/100;
}

    ok.disabled=!hasAny;
  }else if(entryMode==='expense'){
    lab.textContent='本筆採購總費用';
    val.textContent=money(calcTotal());
    val.classList.add('ex'); ok.classList.add('ex');

    lab.textContent='已收訂金（沒收可留空）';
    val.textContent=(!isNaN(dep)&&dep>0)?money(dep):'—';
    val.classList.remove('ex'); ok.classList.remove('ex');
    ok.disabled=!bkSel.name.trim();
  }
}

  const b1=blk(exSel.cat+'・項目（可複選）');

    const on=exSel.items.includes(name);
    b1.chips.appendChild(chipBtn(name,null,on,()=>{
      if(on)exSel.items=exSel.items.filter(x=>x!==name);
      else exSel.items.push(name);
      renderEntryBody();
    },true));
  });
  const oi=document.createElement('input');
  oi.type='text'; oi.placeholder='其他（自行輸入）'; oi.className='inline-input';
  oi.value=exSel.other;
  oi.oninput=()=>{exSel.other=oi.value;};
  b1.chips.appendChild(oi);

  /* 備註 */
  const bn=blk('備註（選填）');
  const ni=document.createElement('input');
  ni.type='text'; ni.placeholder='例：店家、品牌、數量…';
  ni.className='inline-input wide'; ni.value=exSel.note;
  ni.oninput=()=>{exSel.note=ni.value;};
  bn.chips.appendChild(ni);
  body.appendChild(bn.wrap);

  /* 計算機 */
  const cw=document.createElement('div'); cw.className='blk';
  cw.innerHTML='<div class="blk-t">金額（可加減）</div>';
  const calc=document.createElement('div'); calc.className='calc';
  const disp=document.createElement('div'); disp.className='calc-disp';
  const renderDisp=()=>{disp.innerHTML=calcExpr?esc(calcExpr):'<span class="ph">輸入金額，可用＋－累加多筆</span>';updateFoot();};
  renderDisp();
  const keys=document.createElement('div'); keys.className='calc-keys';
  [['7'],['8'],['9'],['＋','op','+'],
   ['4'],['5'],['6'],['－','op','-'],
   ['1'],['2'],['3'],['⌫','op','bs'],
   ['0'],['00'],['.'],['Ｃ','danger','c']
  ].forEach(([label,cls,act])=>{
    const k=document.createElement('button');
    if(cls)k.className=cls;
    k.textContent=label;
    k.onclick=()=>{
      const a=act||label;
      if(a==='c'){calcExpr='';}
      else if(a==='bs'){calcExpr=calcExpr.slice(0,-1);}
      else if(a==='+'||a==='-'){
        if(!calcExpr)return;
        const last=calcExpr.slice(-1);
        if(last==='+'||last==='-')calcExpr=calcExpr.slice(0,-1)+a;
        else if(last==='.')return;
        else calcExpr+=a;
      }else if(a==='.'){
        const seg=calcExpr.split(/[+\-]/).pop();
        if(seg.includes('.'))return;
        calcExpr+=seg===''?'0.':'.';
      }else{
        const seg=calcExpr.split(/[+\-]/).pop();
        if(seg.replace('.','').length>=8)return;
        calcExpr+=a;
      }
      renderDisp();
    };
    keys.appendChild(k);
  });
  calc.appendChild(disp); calc.appendChild(keys); cw.appendChild(calc);
  body.appendChild(cw);

  /* 後台設定區 */
  body.appendChild(buildExpAdmin());
}

$('#okBtn').onclick=()=>{
  const wasEditing=editingId;
  const save=rec=>{ if(wasEditing)updateRecord(wasEditing,rec); else addRecord(rec); };
  if(entryMode==='income'){
    const mo=parseFloat(inSel.monthly);
    /* [FIX] monthlyName/extraName 加 (||'') 防呆，優惠款加 isMonthly 旗標供編輯時辨識 */
    const baseObj=inSel.base?{name:inSel.base.name,price:inSel.base.price}
      :((!isNaN(mo)&&mo>=0&&inSel.monthly!=='')?{name:((inSel.monthlyName||'').trim()||'當月優惠款'),price:mo,isMonthly:true}:null);
    const hasAny=baseObj||inSel.addons.length>0||inSel.removal||inSel.freeRemoval||inSel.pct||(inSel.extra&&parseFloat(inSel.extra)>0);
    if(!hasAny)return;
    const baseName=baseObj?baseObj.name:(inSel.removal?inSel.removal.name:(inSel.freeRemoval?'新客免費卸甲':'其他'));
    const items=[baseName].concat(inSel.addons.map(a=>a.name));
    if(inSel.removal)items.push(inSel.removal.name);
    const dParts=[];
    if(inSel.pct)dParts.push(Math.round(inSel.pct*100)/10+'折');
    if(inSel.freeRemoval&&inSel.removal)dParts.push('新客免費卸甲');
    if(inSel.fixed)dParts.push('折$'+inSel.fixed);
    const c=parseFloat(inSel.custom);
    if(!isNaN(c)&&c>0)dParts.push('折$'+c);
    const ex=parseFloat(inSel.extra);
    save({
      type:'income', date:editDate, amount:incomeTotal(), items:items,
      breakdown:{
        base:baseObj||{name:baseName,price:0},
        addons:inSel.addons.map(a=>({name:a.name,price:a.price}))
          .concat((!isNaN(ex)&&ex>0)?[{name:((inSel.extraName||'').trim()||'款式加價'),price:ex,isExtra:true}]:[]),
        removal:inSel.removal?{name:inSel.removal.name,price:inSel.freeRemoval?0:inSel.removal.price}:null
      },
      discount:dParts.length?{label:dParts.join('・'),pct:inSel.pct,fixed:inSel.fixed||0,custom:isNaN(c)?0:c}:null,
      note:inSel.note.trim(),
      customer:inSel.customer||'',
      bkTime:(checkoutBkInfo&&checkoutBkInfo.bkTime)||'',
      bkChannel:(checkoutBkInfo&&checkoutBkInfo.bkChannel)||'',
      fromBooking:!!checkoutBkInfo
    });
    toast(wasEditing?'已更新紀錄 '+money(incomeTotal()):'已記錄收入 '+money(incomeTotal()));
    checkoutBkInfo=null;
  }else if(entryMode==='expense'){
    const amt=calcTotal();
    if(amt<=0)return;
    const items=exSel.items.slice();
    if(exSel.other.trim())items.push(exSel.other.trim());
    save({
      type:'expense', date:editDate, amount:amt,
      category:exSel.cat, items:items, discount:null, note:exSel.note.trim()
    });
    toast(wasEditing?'已更新紀錄 '+money(amt):'已記錄支出 '+money(amt));
  }
  if(entryMode==='booking'){
    if(!bkSel.name.trim())return;
    /* 撞單提醒：同一天且時間相距 90 分鐘內 */
    if(bkSel.time){
      const toMin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t);return m?(+m[1])*60+(+m[2]):null;};
      const myMin=toMin(bkSel.time);
      const near=live().filter(r=>
        r.type==='booking'&&r.date===editDate&&r.id!==wasEditing&&r.time&&
        myMin!=null&&toMin(r.time)!=null&&Math.abs(toMin(r.time)-myMin)<90
      );
      if(near.length){
        const who=near.map(r=>r.time+' '+r.name).join('、');
        if(!confirm('⚠️ 注意撞單：當天已有「'+who+'」的預約，時間很接近，仍要儲存嗎？'))return;
      }
    }
    const dep=parseFloat(bkSel.deposit);
    save({
      type:'booking', date:editDate,
      name:bkSel.name.trim(),
      time:bkSel.time||'',
      channel:bkSel.channel||bkSel.channelOther.trim(),
      plans:bkSel.plans.map(p=>({name:p.name,price:p.price})),
      planNote:bkSel.planNote.trim(),
      deposit:(!isNaN(dep)&&dep>0)?dep:0
    });
    toast(wasEditing?'已更新預約':'已新增預約：'+bkSel.name.trim());
  }
  closeEntry();
  if(wasEditing)go(curPage); else go('cal');
};

/* ===== IG 預約表圖片產生器（1080×1920，9:16 直式） ===== */
const LS_SCHEDBG='pp_schedbg';
let schedBg=localStorage.getItem(LS_SCHEDBG)||'';

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawCover(ctx,img,W,H){
  const k=Math.max(W/img.width,H/img.height);
  const w=img.width*k,h=img.height*k;
  ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
}
/* 該日已被預約走的時段（預約時間對到最近 90 分鐘內的時段） */
function takenSlots(ds,slots){
  const toMin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t);return m?(+m[1])*60+(+m[2]):null;};
  const taken=new Set();
  live().filter(r=>r.date===ds&&((r.type==='booking'&&r.time)||(r.type==='income'&&r.bkTime))).forEach(b=>{
    const bm=toMin(b.time||b.bkTime); if(bm==null)return;
    let best=null,bd=1e9;
    slots.forEach(sl=>{const d=Math.abs(toMin(sl)-bm);if(d<bd){bd=d;best=sl;}});
    if(best!=null&&bd<90)taken.add(best);
  });
  return taken;
}

function genSchedule(y,m){
  const btn=$('#schedBtn');
  btn.disabled=true; btn.textContent='產生預覽中…';
  const W=1080,H=1920;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  const done=ok=>{
    btn.disabled=false; btn.textContent='產生本月 IG 預約表預覽圖';
    if(ok)toast('預覽已產生，確認後下載 🖼️');
  };
  const schedFam=(opts.sched.font&&opts.sched.font!=='system')?opts.sched.font:null;
  const drawBody=hasImg=>{
    try{
      const fam=(schedFam&&schedFam!=='system')?'"'+schedFam+'",':'';
      const FONT=fam+'"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
      const FS=(schedFam==='ChenYuluoyan')?1.28:1;
      const F=(wgt,px)=>wgt+' '+Math.round(px*FS)+'px '+FONT;
      /* 標題（背景圖或深色底 → 白字加陰影） */
      const darkBg=hasImg||btnTextColor(schedSet().cream)==='#FFF9F2';
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      if(darkBg){ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=14;ctx.fillStyle='#FFFFFF';}
      else ctx.fillStyle=schedSet().brown;
      ctx.font=F('400',40);
      ctx.fillText(String(y),W/2,166);
      ctx.font=F('800',88);
      ctx.fillText(((opts.store&&opts.store.name)||'PuliPuli.Studio')+' '+(m+1)+'月預約',W/2,268);
      ctx.shadowBlur=0;

      /* 計算格子 */
      const first=new Date(y,m,1);
      const offset=(first.getDay()+6)%7;          /* 週一開頭 */
      const days=new Date(y,m+1,0).getDate();
      const rows=Math.ceil((offset+days)/7);
      const slotsByDay={}; let maxSl=0;
      for(let d=1;d<=days;d++){
        const ds=y+'-'+pad(m+1)+'-'+pad(d);
        const sl=effSlots(ds);
        slotsByDay[d]=sl;
        if(sl.length>maxSl)maxSl=sl.length;
      }
      maxSl=Math.max(maxSl,1);
      const footerLines=(opts.sched.footer||'').split('\n').filter(x=>x.trim());

      const px=64,pw=W-128,py=330;
      const headH=64;
      let rowH=66+maxSl*42;
      /* [FIX] 說明文字行高改跟著字體縮放係數 FS，辰宇落雁體才不會被裁到 */
      const footLH=Math.round(44*FS);
      const footH=footerLines.length?56+footerLines.length*footLH:20;
      let panelH=44+headH+rows*rowH+footH+30;
      const maxPanel=H-py-60;
      if(panelH>maxPanel){
        rowH=Math.max(96,Math.floor((maxPanel-44-headH-footH-30)/rows));
        panelH=44+headH+rows*rowH+footH+30;
      }
      /* 白色面板（透明度可調） */
      const pAlpha=(opts.sched.panelAlpha!=null)?opts.sched.panelAlpha:0.92;
      ctx.fillStyle=hexToRgba(darkBg?'#F7F7FC':'#FFFFFF',pAlpha);
      rr(ctx,px,py,pw,panelH,36); ctx.fill();

      const gx=px+34, gw=pw-68, colW=gw/7;
      const gy=py+44;
      const SC=schedSet();
      /* 星期列 */
      ctx.fillStyle=SC.brownSoft; ctx.font=F('700',26);
      ['MON','TUE','WED','THU','FRI','SAT','SUN'].forEach((t,i)=>{
        ctx.fillText(t,gx+i*colW+colW/2,gy+34);
      });
      /* 分隔線 */
      ctx.strokeStyle=hexToRgba(SC.brownSoft,.4); ctx.lineWidth=2;
      for(let r0=0;r0<=rows;r0++){
        const ly=gy+headH+r0*rowH;
        ctx.beginPath();ctx.moveTo(gx,ly);ctx.lineTo(gx+gw,ly);ctx.stroke();
      }
      for(let c0=1;c0<7;c0++){
        ctx.beginPath();ctx.moveTo(gx+c0*colW,gy+headH);ctx.lineTo(gx+c0*colW,gy+headH+rows*rowH);ctx.stroke();
      }
      /* 每一天 */
      const slotFit=Math.floor((rowH-58)/40);
      for(let d=1;d<=days;d++){
        const r0=Math.floor((offset+d-1)/7), c0=(offset+d-1)%7;
        const cx=gx+c0*colW+colW/2;
        const cy=gy+headH+r0*rowH;
        const ds=y+'-'+pad(m+1)+'-'+pad(d);
        ctx.fillStyle=SC.brown2; ctx.font=F('700',28);
        ctx.fillText(String(d),cx,cy+38);
        const sl=slotsByDay[d];
        if(isOffDay(ds)){
          ctx.fillStyle=SC.bk; ctx.font=F('400',24);
          ctx.fillText('休',cx,cy+78);
          continue;
        }
        const taken=takenSlots(ds,sl);
        sl.slice(0,Math.max(slotFit,1)).forEach((t,i)=>{
          const sy=cy+58+i*40;
          if(taken.has(t)){
            ctx.fillStyle=schedSet().cover;
            rr(ctx,cx-(colW-30)/2,sy-6,colW-30,30,15); ctx.fill();
          }else{
            ctx.fillStyle=SC.brown; ctx.font=F('400',27);
            ctx.fillText(t,cx,sy+16);
          }
        });
      }
      /* 底部說明文字 */
      if(footerLines.length){
        ctx.textAlign='left';
        let fy=gy+headH+rows*rowH+58;
        footerLines.forEach((line,i)=>{
          ctx.fillStyle=i===0?SC.brown:SC.brown2;
          /* [FIX] 改用 F() 讓說明文字也吃到字體縮放（原本寫死 px 不會放大） */
          ctx.font=i===0?F('700',30):F('400',26);
          ctx.fillText(line,gx+10,fy);
          fy+=footLH;
        });
      }
      /* 產生後彈出成品預覽，確認再下載 */
      const url=cv.toDataURL('image/png');
      openSchedPreview(url,'pulipuli-'+y+'-'+pad(m+1)+'-預約表.png');
      done(true);
    }catch(e){done(false);toast('產生失敗，請再試一次');}
  };
  const start=()=>{
    if(schedBg){
      const img=new Image();
      img.onload=()=>{drawCover(ctx,img,W,H);drawBody(true);};
      img.onerror=()=>{paintDefault();drawBody(false);};
      img.src=schedBg;
    }else{paintDefault();drawBody(false);}
  };
  if(schedFam&&schedFam!=='system'&&document.fonts&&document.fonts.load){
    ensureFontCss();
    Promise.all([
      document.fonts.load('400 27px "'+schedFam+'"','預約'),
      document.fonts.load('800 88px "'+schedFam+'"','預約')
    ]).then(start).catch(start);
  }else start();

  function paintDefault(){
    ctx.fillStyle=schedSet().cream;
    ctx.fillRect(0,0,W,H);
    /* 可愛的柔色圓點裝飾 */
    const deco=[[120,140,90],[940,120,70],[180,1750,110],[900,1800,85],[70,900,60],[1010,1000,65],[540,60,45],[990,1860,40],[60,1500,50]];
    const cols=schedSet().deco;
    deco.forEach((p,i)=>{
      ctx.globalAlpha=.18;
      ctx.fillStyle=cols[i%cols.length];
      ctx.beginPath();ctx.arc(p[0],p[1],p[2],0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
  }
}

async function exportReport(){
  /* 等使用者字體載好再畫 */
  const famKey=(theme.font&&theme.font!=='system')?theme.font:null;
  if(famKey&&document.fonts&&document.fonts.load){
    ensureFontCss();
    try{await Promise.all([
      document.fonts.load('400 28px "'+famKey+'"','報表'),
      document.fonts.load('800 64px "'+famKey+'"','報表')
    ]);}catch(e){}
  }
  const FONT=(famKey?'"'+famKey+'",':'')+'"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  const FS=(famKey==='ChenYuluoyan')?1.28:1;
  const F=(wgt,px)=>wgt+' '+Math.round(px*FS)+'px '+FONT;

  /* —— 與報表頁相同的計算 —— */
  const per=periodFilter();
  const rs=live().filter(per.test);
  const inSum=rs.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
  const exSum=rs.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
  const visits=rs.filter(r=>r.type==='income').length;
  const avg=visits?Math.round(inSum/visits):0;
  const svcMap={};
  rs.forEach(r=>{
    if(r.type!=='income')return;
    const name=r.breakdown&&r.breakdown.base?r.breakdown.base.name:'其他';
    svcMap[name]=(svcMap[name]||0)+r.amount;
  });
  const svcData=Object.keys(svcMap).map((k,i)=>({label:k,value:svcMap[k],color:pieColors()[i%pieColors().length]}))
    .sort((a,b)=>b.value-a.value).slice(0,6);
  const svcTotal=svcData.reduce((s,d)=>s+d.value,0);
  const yNow=repDate.getFullYear();
  const counts=Array(12).fill(0);
  live().forEach(r=>{
    if(r.type!=='income')return;
    if(r.date.slice(0,4)!=String(yNow))return;
    counts[parseInt(r.date.slice(5,7),10)-1]++;
  });
  const vipMap={};
  live().forEach(r=>{
    if(r.type!=='income')return;
    let name=r.customer||'';
    if(!name&&r.note){const m=/客人：([^・]+)/.exec(r.note);if(m)name=m[1].trim();}
    if(!name)return;
    if(!vipMap[name])vipMap[name]={n:0,sum:0};
    vipMap[name].n++; vipMap[name].sum+=r.amount;
  });
  const vips=Object.keys(vipMap).map(k=>({name:k,...vipMap[k]}))
    .sort((a,b)=>b.n-a.n||b.sum-a.sum).slice(0,8);

  /* —— 版面 —— */
  const W=1080,PAD=56,CW=W-PAD*2;
  const SET=curSet();
  const BROWN=SET.ink, BROWN2=SET.brown2, SOFT=SET.brownSoft;
  const hCardA=(inSum+exSum)>0?400:200;
  const hCardB=250;
  /* [FIX] 服務佔比卡片高度改依項目數計算，6 個項目時圖例才不會爆出卡片 */
  const hCardC=svcTotal>0?Math.max(370,140+svcData.length*46):200;
  const hCardD=330;
  const hCardE=110+(vips.length?vips.length*56:60);
  const heights=[hCardA,hCardB,hCardC,hCardD,hCardE];
  const H=170+heights.reduce((a,b)=>a+b+28,0)+40;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');

  ctx.fillStyle=resolvedBg();
  ctx.fillRect(0,0,W,H);
  ctx.textBaseline='alphabetic';
  /* 標題（深色底自動改白字） */
  const darkBg=btnTextColor(resolvedBg())==='#FFF9F2';
  ctx.fillStyle=darkBg?'#FFFFFF':BROWN; ctx.textAlign='left';
  ctx.font=F('800',46);
  ctx.fillText(((opts.store&&opts.store.name)||'PuliPuli.Studio')+' 營運報表',PAD,86);
  ctx.fillStyle=darkBg?'rgba(255,255,255,.75)':SOFT; ctx.font=F('400',28);
  ctx.fillText(per.label+'　·　產生於 '+fmtD(new Date()),PAD,130);

  let y=170;
  const card=(h,title)=>{
    ctx.fillStyle=SET.card;
    rr(ctx,PAD,y,CW,h,28); ctx.fill();
    ctx.fillStyle=BROWN2; ctx.textAlign='left'; ctx.font=F('700',30);
    ctx.fillText(title,PAD+36,y+58);
    const top=y+58; y+=h+28; return top;
  };
  const donut=(cx0,cy0,R,data,total)=>{
    let a0=-Math.PI/2;
    const nz=data.filter(d=>d.value>0);
    ctx.lineWidth=R*0.42;
    if(nz.length===1){
      ctx.strokeStyle=nz[0].color;
      ctx.beginPath();ctx.arc(cx0,cy0,R*0.79,0,Math.PI*2);ctx.stroke();
      return;
    }
    nz.forEach(d=>{
      const a1=a0+d.value/total*2*Math.PI;
      ctx.strokeStyle=d.color;
      ctx.beginPath();ctx.arc(cx0,cy0,R*0.79,a0,a1);ctx.stroke();
      a0=a1;
    });
  };
  const legend=(x,yy,data,total)=>{
    data.forEach(d=>{
      ctx.fillStyle=d.color; rr(ctx,x,yy-20,24,24,7); ctx.fill();
      ctx.fillStyle=BROWN; ctx.font=F('400',28); ctx.textAlign='left';
      ctx.fillText(d.label,x+38,yy);
      ctx.textAlign='right'; ctx.font=F('700',28);
      ctx.fillText(money(d.value)+'（'+Math.round(d.value/total*100)+'%）',PAD+CW-44,yy);
      ctx.textAlign='left';
      yy+=46;
    });
    return yy;
  };

  /* A. 收支圓餅 */
  let top=card(hCardA,per.label+'・收支圓餅圖');
  if((inSum+exSum)>0){
    const pieData=[{label:'收入',value:inSum,color:curSet().pieIn},{label:'支出',value:exSum,color:curSet().pieEx}];
    donut(PAD+170,top+160,120,pieData,inSum+exSum);
    let ly=legend(PAD+360,top+110,pieData.filter(d=>d.value>0),inSum+exSum);
    ctx.fillStyle=SOFT; ctx.font=F('400',26);
    ctx.fillText('淨額',PAD+360,ly+26);
    ctx.fillStyle=(inSum-exSum)<0?'#C46A5A':BROWN;
    ctx.font=F('800',40);
    ctx.fillText(money(inSum-exSum),PAD+430,ly+28);
  }else{
    ctx.fillStyle=SOFT; ctx.font=F('400',28); ctx.textAlign='center';
    ctx.fillText('此期間尚無資料',W/2,top+90); ctx.textAlign='left';
  }

  /* B. 客單價 */
  top=card(hCardB,'客單價分析');
  ctx.fillStyle=BROWN; ctx.font=F('800',64);
  ctx.fillText(money(avg),PAD+36,top+96);
  const avgW=ctx.measureText(money(avg)).width;
  ctx.fillStyle=SOFT; ctx.font=F('400',28);
  ctx.fillText('/ 人（'+per.label+'）',PAD+36+avgW+16,top+94);
  ctx.fillStyle=BROWN2; ctx.font=F('400',28);
  ctx.fillText('總收入 '+money(inSum)+'　　來客數 '+visits+' 位',PAD+36,top+152);

  /* C. 服務佔比 */
  top=card(hCardC,'服務佔比');
  if(svcTotal>0){
    donut(PAD+170,top+150,110,svcData,svcTotal);
    legend(PAD+360,top+80,svcData,svcTotal);
  }else{
    ctx.fillStyle=SOFT; ctx.font=F('400',28); ctx.textAlign='center';
    ctx.fillText('此期間尚無資料',W/2,top+90); ctx.textAlign='left';
  }

  /* D. 每月客流量 */
  top=card(hCardD,'每月客流量（'+yNow+'）');
  const maxC=Math.max.apply(null,counts.concat([1]));
  const gx=PAD+44, gw=CW-88, bw=gw/12, bh=160, gy=top+44;
  counts.forEach((c,i)=>{
    const h=c/maxC*bh;
    const x=gx+i*bw+6, yb=gy+bh-h;
    ctx.fillStyle=(i===repDate.getMonth())?SET.barOn:SET.barOff;
    rr(ctx,x,yb,bw-12,Math.max(h,4),8); ctx.fill();
    if(c>0){
      ctx.fillStyle=BROWN2; ctx.font=F('700',22); ctx.textAlign='center';
      ctx.fillText(String(c),x+(bw-12)/2,yb-10);
    }
    ctx.fillStyle=SOFT; ctx.font=F('400',22); ctx.textAlign='center';
    ctx.fillText((i+1)+'月',x+(bw-12)/2,gy+bh+34);
  });
  ctx.textAlign='left';

  /* E. 常客排行 */
  top=card(hCardE,'💖 常客排行（累積）');
  if(vips.length){
    const medals=['🥇','🥈','🥉'];
    let vy=top+58;
    vips.forEach((v,i)=>{
      ctx.fillStyle=BROWN; ctx.font=F('400',30);
      ctx.fillText(medals[i]||String(i+1),PAD+40,vy);
      ctx.font=F('700',30);
      ctx.fillText(v.name,PAD+110,vy);
      ctx.fillStyle=SOFT; ctx.font=F('400',26); ctx.textAlign='right';
      ctx.fillText(v.n+' 次',PAD+CW-220,vy);
      ctx.fillStyle=SET.accentDeep; ctx.font=F('700',30);
      ctx.fillText(money(v.sum),PAD+CW-44,vy);
      ctx.textAlign='left';
      vy+=56;
    });
  }else{
    ctx.fillStyle=SOFT; ctx.font=F('400',26);
    ctx.fillText('還沒有資料——用「預約 → 結帳」記下的收入會自動統計',PAD+36,top+70);
  }

  const a=document.createElement('a');
  a.href=cv.toDataURL('image/png');
  a.download='pulipuli-報表-'+fmtD(new Date())+'.png';
  a.click();
}

/* LOGO 上傳：裁切置中縮到 144px，存進同步資料 */
$('#logoFile').onchange=e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const SZ=144;
    const cv=document.createElement('canvas'); cv.width=SZ; cv.height=SZ;
    const ctx=cv.getContext('2d');
    const k=Math.min(SZ/img.width,SZ/img.height);  /* contain：完整置入不裁切 */
    const w=img.width*k,h=img.height*k;
    ctx.drawImage(img,(SZ-w)/2,(SZ-h)/2,w,h);
    let data;
    try{data=cv.toDataURL('image/png');}catch(err){toast('讀取圖片失敗');return;}
    if(data.length>200000){
      try{data=cv.toDataURL('image/jpeg',0.85);}catch(err){}
    }
    if(data.length>300000){toast('LOGO 檔案太大，請換一張簡單一點的');return;}
    opts.store.logo=data;
    saveOpts(); scheduleSync(); applyTheme();
    if($('#setSheet').classList.contains('show'))openSettings();
    toast('已更新 LOGO ✨');
  };
  img.onerror=()=>toast('讀取圖片失敗');
  const fr=new FileReader();
  fr.onload=()=>{img.src=fr.result;};
  fr.readAsDataURL(f);
};

/* ===== 雲端同步分頁 ===== */
function buildSyncTab(body){
  const card=document.createElement('div'); card.className='blk';
  card.innerHTML='<div class="blk-t">☁️ 雲端同步（GitHub Gist）</div>'+
    '<div class="note-mini" style="margin:0 0 6px">到 GitHub → Settings → Developer settings → Personal access tokens 建立 classic token，只勾選 <b>gist</b> 權限，貼到下方即可。權杖只儲存在這台裝置的瀏覽器。</div>';

  const f1=document.createElement('div'); f1.className='field';
  f1.innerHTML='<label>GitHub 權杖（Personal Access Token）</label>';
  const row=document.createElement('div'); row.className='row';
  const ti=document.createElement('input');
  ti.type='password'; ti.className='inline-input wide'; ti.placeholder='ghp_…';
  ti.value=syncCfg.token; ti.autocomplete='off';
  const eye=document.createElement('button'); eye.className='mini-btn'; eye.textContent='顯示';
  eye.onclick=()=>{const show=ti.type==='password';ti.type=show?'text':'password';eye.textContent=show?'隱藏':'顯示';};
  row.appendChild(ti); row.appendChild(eye); f1.appendChild(row);
  card.appendChild(f1);

  const st=document.createElement('div'); st.className='sync-status'; st.id='syncStatus';
  card.appendChild(st);

  const btns=document.createElement('div'); btns.className='btn-row';
  const bTest=document.createElement('button'); bTest.className='mini-btn'; bTest.textContent='測試連線';
  const bSync=document.createElement('button'); bSync.className='mini-btn solid'; bSync.textContent='立即同步';
  const bExp=document.createElement('button'); bExp.className='mini-btn'; bExp.textContent='匯出 JSON 備份';
  const bImp=document.createElement('button'); bImp.className='mini-btn'; bImp.textContent='匯入 JSON';
  btns.appendChild(bTest); btns.appendChild(bSync); btns.appendChild(bExp); btns.appendChild(bImp);
  card.appendChild(btns);
  body.appendChild(card);

  const saveToken=()=>{
    const t=ti.value.trim();
    if(t!==syncCfg.token){syncCfg.token=t; saveSync(); refreshSyncStatus();}
  };
  bTest.onclick=async()=>{
    saveToken();
    if(!syncCfg.token){toast('請先貼上權杖');return;}
    setSyncUI('busy','測試連線中…');
    try{
      const res=await gh('GET','/gists?per_page=1');
      if(res.ok){setSyncUI('ok','權杖有效，可以同步 ✅');toast('連線成功');}
      else setSyncUI('err','權杖無效或權限不足（'+res.status+'）');
    }catch(e){setSyncUI('err','無法連線到 GitHub');}
  };
  bSync.onclick=async()=>{saveToken();await syncNow(true);};
  ti.onchange=saveToken;

  bExp.onclick=()=>{
    const data=JSON.stringify({records:records,opts:opts,exportedAt:new Date().toISOString()},null,2);
    const blob=new Blob([data],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='pulipuli-backup-'+fmtD(new Date())+'.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('已匯出備份檔');
  };
  bImp.onclick=()=>$('#importFile').click();

  refreshSyncStatus();
}

/* 背景圖上傳：縮圖壓縮後存到 localStorage */
$('#bgFile').onchange=e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const MAX=1400;
    let w=img.width,h=img.height;
    if(Math.max(w,h)>MAX){const k=MAX/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    let data;
    try{data=cv.toDataURL('image/jpeg',0.8);}catch(err){toast('讀取圖片失敗');return;}
    if(data.length>3500000){toast('圖片壓縮後仍太大，請換一張');return;}
    theme.image=data; saveTheme(); applyTheme();
    if($('#setSheet').classList.contains('show'))openSettings();
    toast('已套用背景圖 🖼️');
  };
  img.onerror=()=>toast('讀取圖片失敗');
  const fr=new FileReader();
  fr.onload=()=>{img.src=fr.result;};
  fr.readAsDataURL(f);
};

$('#importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const data=JSON.parse(rd.result);
      if(!Array.isArray(data.records))throw 0;
      records=mergeRecords(records,data.records);
      if(data.opts&&(data.opts.updatedAt||0)>(opts.updatedAt||0))opts=data.opts;
      saveRecords(); saveOpts(); scheduleSync();
      renderCal(); toast('匯入完成，已合併 '+data.records.length+' 筆資料');
    }catch(err){toast('檔案格式不正確，匯入失敗');}
  };
  rd.readAsText(f);
  e.target.value='';
};

/* ========= GitHub Gist 同步引擎 ========= */
const GIST_FILE='pulipuli-data.json';
let syncTimer=null, syncing=false;
function scheduleSync(){
  if(!syncCfg.token)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncNow(false),2000);
}
function gh(method,path,bodyObj){
  return fetch('https://api.github.com'+path,{
    method:method,
    headers:{
      'Authorization':'Bearer '+syncCfg.token,
      'Accept':'application/vnd.github+json',
      'Content-Type':'application/json'
    },
    body:bodyObj?JSON.stringify(bodyObj):undefined
  });
}
function mergeRecords(a,b){
  const map={};
  a.concat(b).forEach(r=>{
    if(!r||!r.id)return;
    const old=map[r.id];
    if(!old||(r.updatedAt||0)>(old.updatedAt||0))map[r.id]=r;
  });
  return Object.values(map);
}
function setSyncUI(state,msg){
  const dot=$('#syncDot');
  dot.className='sync-dot '+(state||'');
  const st=$('#syncStatus');
  if(st){
    const ic=state==='ok'?'🟢':state==='busy'?'🟡':state==='err'?'🔴':'⚪️';
    st.innerHTML=ic+' '+esc(msg||'');
  }
}
function refreshSyncStatus(){
  if(!syncCfg.token)setSyncUI('','尚未連線（純單機模式，資料只存在這台裝置）');
  else if(syncCfg.last)setSyncUI('ok','上次同步：'+new Date(syncCfg.last).toLocaleString('zh-TW',{hour12:false}));
  else setSyncUI('','已設定權杖，尚未同步');
}
async function syncNow(manual){
  if(!syncCfg.token){if(manual)toast('請先在設定貼上 GitHub 權杖');return;}
  if(syncing)return;
  syncing=true;
  setSyncUI('busy','同步中…');
  try{
    let remote=null;
    /* 下載 */
    if(syncCfg.gistId){
      const res=await gh('GET','/gists/'+syncCfg.gistId);
      if(res.status===404){syncCfg.gistId='';saveSync();}
      else if(res.ok){
        const g=await res.json();
        const f=g.files&&g.files[GIST_FILE];
        if(f){
          let content=f.content;
          if(f.truncated){const raw=await fetch(f.raw_url);content=await raw.text();}
          try{remote=JSON.parse(content);}catch(e){remote=null;}
        }
      }else throw new Error('讀取失敗 '+res.status);
    }
    if(!syncCfg.gistId){
      /* 尋找既有的 Gist（換裝置時自動接回同一份資料） */
      const ls=await gh('GET','/gists?per_page=100');
      if(ls.ok){
        const arr=await ls.json();
        const hit=arr.find(g=>g.files&&g.files[GIST_FILE]);
        if(hit){
          syncCfg.gistId=hit.id; saveSync();
          const res=await gh('GET','/gists/'+hit.id);
          if(res.ok){
            const g=await res.json();
            const f=g.files[GIST_FILE];
            let content=f.content;
            if(f.truncated){const raw=await fetch(f.raw_url);content=await raw.text();}
            try{remote=JSON.parse(content);}catch(e){remote=null;}
          }
        }
      }else throw new Error('權杖無效（'+ls.status+'）');
    }
    /* 合併 */
    if(remote){
      records=mergeRecords(records,remote.records||[]);
      if(remote.opts&&(remote.opts.updatedAt||0)>(opts.updatedAt||0)){opts=remote.opts;ensureSched();loadThemeObj();applyTheme();}
      saveRecords(); localStorage.setItem(LS_OPT,JSON.stringify(opts));
    }
    /* 上傳 */
    const payload=JSON.stringify({records:records,opts:opts,syncedAt:new Date().toISOString()},null,1);
    if(!syncCfg.gistId){
      const res=await gh('POST','/gists',{
        description:'PuliPuli.Studio 記帳資料（自動同步，請勿手動修改）',
        public:false,
        files:{[GIST_FILE]:{content:payload}}
      });
      if(!res.ok)throw new Error('建立雲端備份失敗 '+res.status);
      const g=await res.json();
      syncCfg.gistId=g.id;
    }else{
      const res=await gh('PATCH','/gists/'+syncCfg.gistId,{files:{[GIST_FILE]:{content:payload}}});
      if(!res.ok)throw new Error('上傳失敗 '+res.status);
    }
    syncCfg.last=Date.now(); saveSync();
    setSyncUI('ok','上次同步：'+new Date(syncCfg.last).toLocaleString('zh-TW',{hour12:false}));
    if(manual)toast('同步完成 ☁️');
    if(curPage==='cal')renderCal();
    if(curPage==='rec')renderRec();
    if(curPage==='rep')renderRep();
  }catch(e){
    setSyncUI('err','同步失敗：'+(e.message||'網路或權杖問題'));
    if(manual)toast('同步失敗，請檢查網路與權杖');
  }finally{
    syncing=false;
  }
}

/* ========= 啟動 ========= */
applyTheme();
renderCal();
if(syncCfg.token)syncNow(false);
else refreshSyncStatus();

</script>
