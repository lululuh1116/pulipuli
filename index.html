<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FAF5EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PuliPuli.Studio 記帳</title>
<style>
:root{
  --cream:#FAF5EE;
  --milk:#F3EAE0;
  --card:#FFFFFF;
  --line:#EDE2D4;
  --brown:#5C4633;
  --brown-2:#7A6450;
  --brown-soft:#A08C77;
  --accent:#C9A176;
  --accent-deep:#A87E52;
  --pink:#E9CFC3;
  --pink-deep:#D3A593;
  --red:#C25E52;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:12px;
  --shadow:0 6px 20px rgba(92,70,51,.08);
  --shadow-sm:0 3px 10px rgba(92,70,51,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--cream);
  color:var(--brown);
  font-size:15px;
  line-height:1.55;
  letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}


/* ===== RWD：網頁版單純加寬，排版與手機相同 ===== */
@media(min-width:768px){
  main{max-width:720px}
  header.app>*{max-width:720px;margin-left:auto;margin-right:auto}
  .sheet{max-width:640px}
}

/* ===== 頂部 ===== */
header.app{
  position:sticky;top:0;z-index:30;
  background:var(--header-bg,rgba(250,245,238,.92));
  backdrop-filter:blur(10px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
}
.brand-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:18px;font-weight:800;letter-spacing:.04em}
.brand .sub{font-size:11px;color:var(--brown-soft)}
.head-actions{display:flex;align-items:center;gap:10px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#CFC4B5;display:inline-block}
.sync-dot.ok{background:#9DBB8F}
.sync-dot.busy{background:var(--accent);animation:pulse 1s infinite}
.sync-dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.gear-btn{font-size:24px;width:48px;height:48px;border-radius:50%;background:var(--milk);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}

/* 快選列 */
nav.quick{
  display:flex;gap:6px;margin-top:10px;
  background:var(--milk);border-radius:999px;padding:4px;
}
nav.quick button{
  flex:1;padding:9px 0;border-radius:999px;font-size:14px;font-weight:600;color:var(--brown-2);
  transition:background .2s,color .2s;
}
nav.quick button.on{background:var(--btn,var(--brown));color:var(--btn-text,var(--cream));box-shadow:var(--shadow-sm)}

main{padding:14px 16px 120px;max-width:560px;margin:0 auto}
.page{display:none}
.page.on{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{font-size:14px;font-weight:700;color:var(--brown-2);margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* ===== 月曆 ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .ttl{font-size:17px;font-weight:800;letter-spacing:.06em}
.cal-nav{width:38px;height:38px;border-radius:50%;background:var(--milk);font-size:16px;color:var(--brown-2)}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-week span{text-align:center;font-size:11px;color:var(--brown-soft);padding:4px 0 8px}
.cal-grid button.day{
  position:relative;height:48px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.cal-grid button.day:active{background:var(--milk)}
.day .num{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;
  transition:background .15s,color .15s;
}
.day.today .num{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.sel .num{background:var(--btn,var(--brown));color:var(--btn-text,var(--cream))}
.day .dots{display:flex;gap:3px;height:4px}
.day .dots i{width:4px;height:4px;border-radius:50%}
.day .dots i.in{background:var(--accent-deep)}
.day .dots i.ex{background:var(--pink-deep)}
.day .dots i.bk{background:#9DBB8F}
.day.dim{opacity:.28}

/* 當日收支方框 */
.day-panel{min-height:120px}
.day-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#dayCfgBar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#dayCfgBar .mini-btn{padding:6px 10px;font-size:12px}
.day-panel .empty{color:var(--brown-soft);font-size:13px;text-align:center;padding:26px 0}
.rec-li{
  display:flex;align-items:center;gap:10px;
  padding:10px 2px;border-bottom:1px dashed var(--line);
}
.rec-li:last-child{border-bottom:none}
.rec-li .ic{
  width:34px;height:34px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.rec-li .ic.in{background:#F0E5D3}
.rec-li .ic.ex{background:#F4E2DA}
.rec-li .body{flex:1;min-width:0}
.rec-li .t1{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-li .t2{font-size:11.5px;color:var(--brown-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-li .amt{font-weight:800;font-size:14.5px;white-space:nowrap}
.rec-li .amt.in{color:var(--brown)}
.rec-li .amt.ex{color:var(--red)}
.rec-li .del{font-size:15px;padding:6px;opacity:.65}

/* FAB */
.fab{
  position:fixed;right:20px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:25;
  width:58px;height:58px;border-radius:50%;
  background:var(--btn,var(--brown));color:var(--btn-text,var(--cream));font-size:28px;font-weight:300;
  box-shadow:0 10px 24px rgba(92,70,51,.35);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.fab:active{transform:scale(.92)}

/* ===== 膠囊列 ===== */
.pill-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.pill-scroll::-webkit-scrollbar{display:none}
.pill{
  flex:none;padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:600;
  background:var(--card);color:var(--brown-2);box-shadow:var(--shadow-sm);
  transition:background .15s,color .15s;
}
.pill.on{background:var(--brown);color:var(--cream)}

/* ===== 總紀錄 ===== */
.rec-day-h{font-size:12.5px;font-weight:700;color:var(--brown-soft);margin:14px 2px 4px;letter-spacing:.05em}
.rec-day-h:first-child{margin-top:2px}

/* 底部懸浮總價欄（總紀錄頁） */
.week-total{
  position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;
  max-width:528px;margin:0 auto;
  background:var(--card);border-radius:var(--r-lg);box-shadow:0 10px 28px rgba(92,70,51,.18);
  padding:14px 18px;display:none;align-items:center;justify-content:space-between;
}
.week-total.show{display:flex}
.week-total .lab{font-size:13px;color:var(--brown-soft);font-weight:600}
.week-total .val{font-size:20px;font-weight:800;color:var(--brown)}
.week-total .val.neg{color:var(--red)}

/* ===== 報表 ===== */
.chart-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.legend{display:flex;flex-direction:column;gap:6px;min-width:140px}
.legend .lg{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .lg i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .lg b{margin-left:auto;font-weight:700}
.kpi{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.kpi .big{font-size:34px;font-weight:800;line-height:1.1}
.kpi .unit{font-size:13px;color:var(--brown-soft)}
.kpi-sub{display:flex;gap:18px;margin-top:10px;font-size:12.5px;color:var(--brown-soft)}
.kpi-sub b{color:var(--brown);font-weight:700}
.note-mini{font-size:11.5px;color:var(--brown-soft);margin-top:8px}
.bars{width:100%}

/* ===== Bottom Sheet ===== */
.sheet-mask{
  position:fixed;inset:0;background:rgba(70,52,36,.35);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--cream);
  border-radius:26px 26px 0 0;
  max-height:88vh;max-width:560px;margin:0 auto;
  display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,.33,1);
  box-shadow:0 -8px 40px rgba(92,70,51,.25);
}
.sheet.show{transform:none}
.sheet-grip{width:42px;height:5px;border-radius:99px;background:var(--line);margin:10px auto 4px;flex:none}
.sheet-head{padding:4px 18px 10px;flex:none}
.sheet-body{overflow-y:auto;padding:0 18px 16px;-webkit-overflow-scrolling:touch}
.seg{
  display:flex;background:var(--milk);border-radius:999px;padding:4px;margin-top:6px;
}
.seg button{flex:1;padding:9px 0;border-radius:999px;font-size:14px;font-weight:700;color:var(--brown-2)}
.seg button.on.in{background:var(--btn,var(--brown));color:var(--btn-text,var(--cream))}
.seg button.on.ex{background:var(--pink-deep);color:#fff}
.seg button.on.bk{background:#8FAE81;color:#fff}
.rec-li .ic.bk{background:#EAF1E6}
.rec-li .amt.bk{color:#7E9A70;font-size:12px;font-weight:700}
.checkout-btn{
  padding:7px 12px;border-radius:999px;background:#8FAE81;color:#fff;
  font-size:12px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow-sm);
}
.sheet-date{text-align:center;font-size:12.5px;color:var(--brown-soft);margin-top:8px}

.blk{margin-top:14px}
.blk .blk-t{font-size:13px;font-weight:700;color:var(--brown-2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:8px 14px;border-radius:14px;font-size:13.5px;font-weight:600;
  background:var(--card);box-shadow:var(--shadow-sm);color:var(--brown-2);
  transition:background .15s,color .15s;
}
.chip small{font-weight:500;opacity:.7;margin-left:4px;font-size:11px}
.chip.on{background:var(--brown);color:var(--cream)}
.chip.on small{opacity:.85}
.chip.ex-on{background:var(--pink-deep);color:#fff}
.inline-input{
  border:1.5px solid var(--line);border-radius:12px;background:var(--card);
  padding:8px 12px;font-size:14px;width:120px;
}
.inline-input.wide{width:100%}

/* 計算機 */
.calc{margin-top:10px}
.calc-disp{
  background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow-sm);
  padding:12px 16px;text-align:right;font-size:22px;font-weight:700;letter-spacing:.04em;
  min-height:52px;word-break:break-all;
}
.calc-disp .ph{color:var(--brown-soft);font-size:15px;font-weight:500}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.calc-keys button{
  padding:13px 0;border-radius:var(--r-md);background:var(--card);box-shadow:var(--shadow-sm);
  font-size:18px;font-weight:600;
}
.calc-keys button:active{background:var(--milk)}
.calc-keys .op{background:var(--milk);color:var(--accent-deep)}
.calc-keys .danger{color:var(--red);font-size:15px}

/* 懸浮總價欄（Sheet 內 Sticky Footer） */
.sheet-foot{
  flex:none;padding:12px 18px calc(14px + env(safe-area-inset-bottom));
  background:var(--card);border-radius:22px 22px 0 0;
  box-shadow:0 -4px 18px rgba(92,70,51,.10);
  display:flex;align-items:center;gap:14px;
}
.sheet-foot .total{flex:1}
.sheet-foot .total .lab{font-size:11.5px;color:var(--brown-soft)}
.sheet-foot .total .val{font-size:24px;font-weight:800}
.sheet-foot .total .val.ex{color:var(--red)}
.ok-btn{
  padding:13px 34px;border-radius:999px;background:var(--btn,var(--brown));color:var(--btn-text,var(--cream));
  font-size:16px;font-weight:800;letter-spacing:.15em;
  box-shadow:0 6px 16px rgba(92,70,51,.3);
}
.ok-btn:disabled{opacity:.35;box-shadow:none}
.ok-btn.ex{background:var(--pink-deep)}

/* 後台設定 / 同步設定 */
.fold-t{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  font-size:13px;font-weight:700;color:var(--brown-soft);padding:14px 0 6px;
}
.fold-t .arr{transition:transform .2s}
.fold-t.open .arr{transform:rotate(180deg)}
.fold-body{display:none;padding-bottom:8px}
.fold-body.open{display:block}
.opt-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.opt-row .nm{flex:1}
.opt-row .pr{color:var(--brown-soft);font-size:12.5px}
.opt-row .rm{color:var(--red);padding:4px 8px;font-size:13px}
.opt-add{display:flex;gap:6px;margin-top:8px}
.opt-add input{flex:1;min-width:0}
.opt-add input.price{flex:none;width:84px}
.mini-btn{
  padding:8px 14px;border-radius:12px;background:var(--milk);font-size:13px;font-weight:700;color:var(--brown-2);flex:none;
}
.mini-btn.solid{background:var(--btn,var(--brown));color:var(--btn-text,var(--cream))}
.field{margin-top:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--brown-2);margin-bottom:5px}
.field .row{display:flex;gap:8px}
.sync-status{
  margin-top:12px;padding:10px 14px;border-radius:var(--r-md);background:var(--milk);
  font-size:13px;display:flex;align-items:center;gap:8px;
}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{
  position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);
  background:var(--brown);color:var(--cream);font-size:13.5px;font-weight:600;
  padding:10px 20px;border-radius:999px;z-index:99;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;white-space:nowrap;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="bgLayer" style="position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;pointer-events:none"></div>

<header class="app">
  <div class="brand-row">
    <div class="brand"><h1>PuliPuli.Studio</h1><span class="sub">美甲記帳</span></div>
    <div class="head-actions">
      <span class="sync-dot" id="syncDot" title="同步狀態"></span>
      <button class="gear-btn" id="gearBtn" aria-label="設定">⚙︎</button>
    </div>
  </div>
  <nav class="quick" role="tablist">
    <button id="navCal" class="on">月曆</button>
    <button id="navSched">預約表</button>
    <button id="navRec">總紀錄</button>
    <button id="navRep">報表</button>
  </nav>
</header>

<main>
  <!-- 頁面 1：月曆 -->
  <section class="page on" id="pageCal">
    <div id="bkNotice"></div>
    <div class="card">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" aria-label="上個月">‹</button>
        <div class="ttl" id="calTitle"></div>
        <button class="cal-nav" id="calNext" aria-label="下個月">›</button>
      </div>
      <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="card day-panel">
      <div class="day-panel-head">
        <h3 id="dayPanelTitle" style="margin-bottom:0">當日收支</h3>
        <div id="dayCfgBar"></div>
      </div>
      <div id="dayList"></div>
    </div>
  </section>

  <!-- 頁面：IG 預約表 -->
  <section class="page" id="pageSched">
    <div class="card">
      <div class="cal-head">
        <button class="cal-nav" id="schedPrev" aria-label="上個月">‹</button>
        <div class="ttl" id="schedTitle"></div>
        <button class="cal-nav" id="schedNext" aria-label="下個月">›</button>
      </div>
      <div id="schedPreview"></div>
    </div>
    <button class="ok-btn" id="schedBtn" style="width:100%">🖼️ 產生這個月的 IG 預約表</button>
    <div class="note-mini" style="text-align:center;margin-top:8px">公休與單日時段在「月曆」當天調整；預設時段、底部文字與背景在 ⚙️ 設定 →「IG 預約表」。</div>
  </section>

  <!-- 頁面 2：總紀錄 -->
  <section class="page" id="pageRec">
    <div class="pill-scroll" id="weekPills"></div>
    <div class="card" id="recListCard">
      <div id="recList"></div>
    </div>
  </section>

  <!-- 頁面 3：報表 -->
  <section class="page" id="pageRep">
    <div class="pill-scroll" style="justify-content:center">
      <button class="pill" data-per="day">日報表</button>
      <button class="pill on" data-per="month">月報表</button>
      <button class="pill" data-per="year">年報表</button>
    </div>
    <div class="card">
      <h3 id="repPieTitle">收支圓餅圖</h3>
      <div class="chart-wrap" id="repPie"></div>
    </div>
    <div class="card">
      <h3>客單價分析</h3>
      <div id="repAvg"></div>
      <div class="note-mini">客單價＝期間總收入 ÷ 來客數，可追蹤造型款與加價項目是否提升單價。</div>
    </div>
    <div class="card">
      <h3>服務佔比</h3>
      <div class="chart-wrap" id="repSvc"></div>
      <div class="note-mini">以基礎服務的營收比例計算，輔助進貨與備料決策。</div>
    </div>
    <div class="card">
      <h3>每月客流量</h3>
      <div class="bars" id="repBars"></div>
      <div class="note-mini">每月來客數（收入筆數），輔助規劃活動與優惠檔期。</div>
    </div>
    <div class="card">
      <h3>💖 常客排行（累積）</h3>
      <div id="repVip"></div>
      <div class="note-mini">從預約結帳的客人自動統計，看看誰是你的鐵粉。</div>
    </div>
    <button class="ok-btn" id="repExport" style="width:100%;margin-top:4px">🖼️ 把這頁報表匯出成圖片</button>
  </section>
</main>

<div class="week-total" id="weekTotal">
  <span class="lab" id="weekTotalLab">本週合計</span>
  <span class="val" id="weekTotalVal">$0</span>
</div>

<button class="fab" id="fabBtn" aria-label="新增紀錄">＋</button>

<!-- 收入支出記帳 Bottom Sheet -->
<div class="sheet-mask" id="entryMask"></div>
<div class="sheet" id="entrySheet" role="dialog" aria-label="收入支出記帳">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <div class="seg">
      <button id="segBk">📅 預約</button>
      <button id="segIn" class="on in">收入</button>
      <button id="segEx">支出</button>
    </div>
    <div class="sheet-date" id="entryDate"></div>
  </div>
  <div class="sheet-body" id="entryBody"></div>
  <div class="sheet-foot">
    <div class="total">
      <div class="lab" id="footLab">顧客支付金額</div>
      <div class="val" id="footVal">$0</div>
    </div>
    <button class="ok-btn" id="okBtn" disabled>OK</button>
  </div>
</div>

<!-- 設定 Bottom Sheet -->

<script>
/* ========= 工具 ========= */

const fmtD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const money=n=>{

};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function toast(msg){

/* ========= 資料 ========= */
const LS_REC='pp_records', LS_OPT='pp_options', LS_SYNC='pp_sync';
const DEFAULT_OPTS={
  updatedAt:0,
  base:[
    {id:'b1',name:'本店純卸甲(不續)',price:200},
    {id:'b2',name:'他店純卸甲(不續)',price:300},
    {id:'b3',name:'單色',price:399},
    {id:'b4',name:'貓眼',price:499},
    {id:'b5',name:'鏡面',price:599},

  ],
  addon:[

  ],

    {id:'r1',name:'本店卸甲(續作)',price:100},

  ],
  sched:{
    slots:['11:00','15:00','19:00'],

    footer:'簡易款式$599，卸甲$100，手繪來圖報價。\n*暫不接延甲\n*不接病甲/傷甲\n*不開放攜伴\n*內有狗狗&倉鼠，害怕動物者請斟酌'
  }
};
function ensureSched(){
  let dirty=false;
  if(!opts.sched){opts.sched=JSON.parse(JSON.stringify(DEFAULT_OPTS.sched));dirty=true;}
  if(!opts.sched.slots)opts.sched.slots=['11:00','15:00','19:00'];
  if(!opts.sched.days)opts.sched.days={};
  if(opts.sched.footer==null)opts.sched.footer=DEFAULT_OPTS.sched.footer;
  /* 收入基礎服務：在「單色」前補上「卸甲 $100」（一次性遷移） */
  if(!opts.mig_xiejia){
    if(!opts.base.some(o=>o.name==='卸甲')){
      const i=opts.base.findIndex(o=>o.name==='單色');
      const item={id:uid(),name:'卸甲',price:100};
      if(i>=0)opts.base.splice(i,0,item); else opts.base.push(item);
    }
    opts.mig_xiejia=true; dirty=true;

  /* 預約服務項目後台（預設複製基礎服務） */
  if(!opts.bookSvc){
    opts.bookSvc=opts.base.map(o=>({id:uid(),name:o.name,price:o.price}));

  /* 支出分類後台 */

  /* 遷移只寫入本機，不推進 updatedAt——否則新裝置會誤以為自己的設定比雲端新 */
  if(dirty)localStorage.setItem(LS_OPT,JSON.stringify(opts));
}

  '工作室營運':['租金','水電費','網路'],

const LS_THEME='pp_theme';
const THEME_DEFAULT_COLOR='#FAF5EE';

let _fontCssLoaded=false;
function ensureFontCss(){
  if(_fontCssLoaded)return;
  _fontCssLoaded=true;
  const l=document.createElement('link');
  l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family=Huninn&family=Iansui&family=LXGW+WenKai+TC&family=Noto+Serif+TC:wght@400;700;800&display=swap';
  document.head.appendChild(l);
}
function btnTextColor(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');
  if(!m)return '';
  const n=parseInt(m[1],16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return (r*0.299+g*0.587+b*0.114)>165?'#5C4633':'#FFF9F2';
}
function saveTheme(){try{localStorage.setItem(LS_THEME,JSON.stringify(theme))}catch(e){toast('圖片太大，無法儲存，請換一張小一點的')}}
function hexToRgba(hex,a){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');
  if(!m)return 'rgba(250,245,238,'+a+')';
  const n=parseInt(m[1],16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function applyTheme(){
  const c=theme.color||THEME_DEFAULT_COLOR;
  document.documentElement.style.setProperty('--cream',c);
  document.documentElement.style.setProperty('--header-bg',hexToRgba(c,.9));
  const mt=document.querySelector('meta[name=theme-color]');
  if(mt)mt.setAttribute('content',c);
  const bg=document.getElementById('bgLayer');
  if(bg)bg.style.backgroundImage=theme.image?'url('+theme.image+')':'none';
  /* 字體 */
  if(theme.font&&theme.font!=='system'){
    ensureFontCss();
    document.body.style.fontFamily='"'+theme.font+'","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  }else{
    document.body.style.fontFamily='';
  }
  /* 按鈕底色 */
  if(theme.btn){
    document.documentElement.style.setProperty('--btn',theme.btn);
    document.documentElement.style.setProperty('--btn-text',btnTextColor(theme.btn));
  }else{
    document.documentElement.style.removeProperty('--btn');
    document.documentElement.style.removeProperty('--btn-text');
  }
}

function addRecord(r){
  r.id=uid(); r.updatedAt=Date.now();
  records.push(r); saveRecords(); scheduleSync();
}
function delRecord(id){
  const r=records.find(x=>x.id===id);
  if(r){r.deleted=true; r.updatedAt=Date.now(); saveRecords(); scheduleSync();}
}
function updateRecord(id,r){
  const i=records.findIndex(x=>x.id===id);
  if(i<0)return;
  r.id=id; r.updatedAt=Date.now();
  records[i]=r; saveRecords(); scheduleSync();
}

const pages={cal:$('#pageCal'),sched:$('#pageSched'),rec:$('#pageRec'),rep:$('#pageRep')};

/* ========= 月曆 ========= */
const today=new Date(); today.setHours(0,0,0,0);
let calY=today.getFullYear(), calM=today.getMonth();
let selDate=fmtD(today);

$('#calPrev').onclick=()=>{calM--;if(calM<0){calM=11;calY--;}renderCal();};
$('#calNext').onclick=()=>{calM++;if(calM>11){calM=0;calY++;}renderCal();};

function renderCal(){
  $('#calTitle').textContent=calY+'年 '+(calM+1)+'月';
  const grid=$('#calGrid'); grid.innerHTML='';
  const first=new Date(calY,calM,1);
  const days=new Date(calY,calM+1,0).getDate();
  const dayMap={};
  live().forEach(r=>{
    if(!dayMap[r.date])dayMap[r.date]={in:false,ex:false,bk:false};
    dayMap[r.date][r.type==='income'?'in':r.type==='expense'?'ex':'bk']=true;
  });
  for(let i=0;i<first.getDay();i++){const b=document.createElement('button');b.className='day dim';b.disabled=true;grid.appendChild(b);}
  for(let d=1;d<=days;d++){
    const ds=calY+'-'+pad(calM+1)+'-'+pad(d);
    const b=document.createElement('button');
    b.className='day'+(ds===fmtD(today)?' today':'')+(ds===selDate?' sel':'');
    const dots=dayMap[ds]||{};
    b.innerHTML='<span class="num">'+d+'</span><span class="dots">'+(dots.in?'<i class="in"></i>':'')+(dots.ex?'<i class="ex"></i>':'')+(dots.bk?'<i class="bk"></i>':'')+'</span>';
    b.onclick=()=>{selDate=ds;renderCal();};
    grid.appendChild(b);
  }
  renderDayPanel();
  renderBkNotice();
}

/* ===== 今日／明日預約提醒 ===== */
function renderBkNotice(){
  const box=$('#bkNotice'); if(!box)return;
  box.innerHTML='';
  const days=[[fmtD(today),'今天'],[fmtD(new Date(today.getTime()+864e5)),'明天']];
  days.forEach(([ds,label])=>{
    const bks=live().filter(r=>r.type==='booking'&&r.date===ds)
      .sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    if(!bks.length)return;
    const div=document.createElement('div');
    div.style.cssText='background:#EAF1E6;border:1px solid #CBDCC1;border-radius:var(--r-md);padding:10px 14px;margin-bottom:10px;font-size:13px;color:#5C6E51;box-shadow:var(--shadow-sm);cursor:pointer';
    div.innerHTML='<b>📅 '+label+' '+bks.length+' 位預約</b>　'+
      bks.map(b=>esc((b.time?b.time+' ':'')+b.name)).join('、');
    div.onclick=()=>{
      const d=new Date(ds+'T00:00:00');
      selDate=ds; calY=d.getFullYear(); calM=d.getMonth();
      renderCal();
    };
    box.appendChild(div);
  });
}

function recTitle(r){
  if(r.type==='booking')return (r.time?r.time+'　':'')+r.name;
  if(r.type==='income'){
    const base=r.breakdown&&r.breakdown.base?r.breakdown.base.name:'收入';
    const extra=(r.breakdown&&r.breakdown.addons&&r.breakdown.addons.length)?'＋'+r.breakdown.addons.length+'項加價':'';
    return base+extra;
  }
  return r.category||'支出';
}
function recSub(r){
  if(r.type==='booking'){
    const parts=[];
    if(r.channel)parts.push(r.channel+'預約');
    const pl=r.plans||(r.plan?[r.plan]:[]);
    if(pl.length)parts.push(pl.map(p=>p.name).join('＋'));
    if(r.planNote)parts.push(r.planNote);
    if(r.deposit>0)parts.push('訂金$'+r.deposit);
    return parts.join('・')||'待結帳';
  }
  if(r.type==='income'){
    const parts=[];
    if(r.breakdown){
      if(r.breakdown.removal)parts.push(r.breakdown.removal.name);
      if(r.breakdown.addons)r.breakdown.addons.forEach(a=>parts.push(a.name));
    }
    if(r.discount&&r.discount.label)parts.push(r.discount.label);
    if(r.note)parts.push(r.note);
    return parts.join('・')||'基礎服務';
  }
  const parts=(r.items||[]).slice();
  if(r.note)parts.push(r.note);
  return parts.join('・')||'—';
}
function recLi(r,showDel){
  const li=document.createElement('div'); li.className='rec-li';
  const isBk=r.type==='booking';
  const isIn=r.type==='income';
  li.innerHTML=
    '<div class="ic '+(isBk?'bk':isIn?'in':'ex')+'">'+(isBk?'📅':isIn?'💅':'🧾')+'</div>'+
    '<div class="body"><div class="t1">'+esc(recTitle(r))+'</div><div class="t2">'+esc(recSub(r))+'</div></div>'+
    (isBk
      ?'<button class="checkout-btn">結帳</button>'
      :'<div class="amt '+(isIn?'in':'ex')+'">'+(isIn?'+':'-')+money(r.amount).replace('-','')+'</div>')+
    (showDel?'<button class="del" aria-label="刪除">🗑️</button>':'');
  li.style.cursor='pointer';
  li.onclick=()=>openEntry(r);
  if(isBk)li.querySelector('.checkout-btn').onclick=(e)=>{
    e.stopPropagation();
    openCheckout(r);
  };
  if(showDel)li.querySelector('.del').onclick=(e)=>{
    e.stopPropagation();
    if(confirm(isBk?'確定刪除這筆預約？':'確定刪除這筆紀錄？')){delRecord(r.id);renderCal();}
  };
  return li;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderDayPanel(){
  const d=new Date(selDate+'T00:00:00');
  $('#dayPanelTitle').textContent=(d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）收支';
  const list=$('#dayList'); list.innerHTML='';

  /* ---- 時段／公休設定（並排在標題旁） ---- */
  const bar=$('#dayCfgBar'); bar.innerHTML='';
  const off=isOffDay(selDate);
  const offBtn=document.createElement('button');
  offBtn.className='mini-btn'+(off?' solid':'');
  offBtn.textContent=off?'💤 本日公休中（點我恢復）':'💤 設為公休';
  offBtn.onclick=()=>{
    if(off)delete opts.sched.days[selDate];
    else opts.sched.days[selDate]={off:true};
    saveSched(); renderCal();
    toast(off?'已恢復營業':'已設為公休 💤');
  };
  bar.appendChild(offBtn);
  if(!off){
    const slotBtn=document.createElement('button');
    slotBtn.className='mini-btn';
    const c=dayCfg(selDate);
    slotBtn.textContent='🕐 本日時段'+(c&&c.slots?'（自訂）':'');
    bar.appendChild(slotBtn);
    const ed=document.createElement('div');
    ed.style.cssText='display:none;width:100%;background:var(--milk);border-radius:var(--r-sm);padding:10px';
    slotBtn.onclick=()=>{ed.style.display=ed.style.display==='none'?'block':'none';};
    const renderEd=()=>{
      ed.innerHTML='<div style="font-size:12px;color:var(--brown-soft);margin-bottom:6px">這一天開放的預約時段（會用在 IG 預約表）：</div>';
      const chipsW=document.createElement('div'); chipsW.className='chips';
      effSlots(selDate).forEach(t=>{
        const ch=document.createElement('button'); ch.className='chip on';
        ch.innerHTML=esc(t)+'　✕';
        ch.onclick=()=>{
          const cur=effSlots(selDate).filter(x=>x!==t);
          opts.sched.days[selDate]={slots:cur};
          saveSched(); renderEd(); renderBkNotice();
        };
        chipsW.appendChild(ch);
      });
      ed.appendChild(chipsW);
      const addRow=document.createElement('div');
      addRow.style.cssText='display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap';
      let newT='';
      addRow.appendChild(timeSelects('',v=>{newT=v;}));
      const ab=document.createElement('button'); ab.className='mini-btn solid'; ab.textContent='新增時段';
      ab.onclick=()=>{
        if(!newT){toast('請先選時間');return;}
        const cur=effSlots(selDate);
        if(cur.includes(newT)){toast('這個時段已存在');return;}
        opts.sched.days[selDate]={slots:cur.concat([newT]).sort()};
        saveSched(); renderEd();
      };
      addRow.appendChild(ab);
      if(dayCfg(selDate)&&dayCfg(selDate).slots){
        const rb=document.createElement('button'); rb.className='mini-btn'; rb.textContent='恢復預設';
        rb.onclick=()=>{delete opts.sched.days[selDate];saveSched();renderEd();renderDayPanel();};
        addRow.appendChild(rb);
      }
      ed.appendChild(addRow);
    };
    renderEd();
    list.appendChild(ed);
  }

  const all=live().filter(r=>r.date===selDate);
  const bks=all.filter(r=>r.type==='booking').sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  const others=all.filter(r=>r.type!=='booking').sort((a,b)=>a.updatedAt-b.updatedAt);
  const rs=bks.concat(others);
  if(!rs.length){
    const emp=document.createElement('div'); emp.className='empty';
    emp.textContent='這天還沒有紀錄，點右下角「＋」開始記帳 ☁️';
    list.appendChild(emp); return;
  }
  rs.forEach(r=>list.appendChild(recLi(r,true)));
  const hint=document.createElement('div');
  hint.style.cssText='font-size:11px;color:var(--brown-soft);text-align:center;padding-top:6px';
  hint.textContent='點一下紀錄即可修改 ✏️';
  list.appendChild(hint);
}

/* ========= 總紀錄 ========= */
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x;}
let selWeek=weekStart(today).getTime();

function renderRec(){
  const pills=$('#weekPills'); pills.innerHTML='';
  const cur=weekStart(today).getTime();
  let min=cur;
  live().forEach(r=>{const t=weekStart(new Date(r.date+'T00:00:00')).getTime();if(t<min)min=t;});
  const weeks=[];
  for(let t=cur+7*864e5*4; t>=min; t-=7*864e5)weeks.push(t);
  weeks.sort((a,b)=>a-b);
  let selBtn=null;
  weeks.forEach(t=>{
    const s=new Date(t), e=new Date(t+6*864e5);
    const b=document.createElement('button');
    b.className='pill'+(t===selWeek?' on':'');
    b.textContent=(t===cur?'本週 ':'')+(s.getMonth()+1)+'/'+s.getDate()+'–'+(e.getMonth()+1)+'/'+e.getDate();
    b.onclick=()=>{selWeek=t;renderRec();};
    pills.appendChild(b);
    if(t===selWeek)selBtn=b;
  });
  if(selBtn)requestAnimationFrame(()=>selBtn.scrollIntoView({inline:'center',block:'nearest'}));

  const list=$('#recList'); list.innerHTML='';
  const s=selWeek, e=selWeek+7*864e5;
  let total=0, any=false, todayHdr=null;
  for(let t=s;t<e;t+=864e5){
    const ds=fmtD(new Date(t));
    const rs=live().filter(r=>r.date===ds).sort((a,b)=>a.updatedAt-b.updatedAt);
    if(!rs.length)continue;
    any=true;
    const d=new Date(t);
    const h=document.createElement('div'); h.className='rec-day-h';
    h.textContent=(d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）'+(ds===fmtD(today)?'・今天':'');
    list.appendChild(h);
    if(ds===fmtD(today))todayHdr=h;
    rs.forEach(r=>{
      total+=r.type==='income'?r.amount:r.type==='expense'?-r.amount:0;
      list.appendChild(recLi(r,false));
    });
  }
  if(!any)list.innerHTML='<div class="empty" style="color:var(--brown-soft);font-size:13px;text-align:center;padding:26px 0">這一週沒有任何紀錄</div>';
  const tv=$('#weekTotalVal');
  tv.textContent=money(total);
  tv.classList.toggle('neg',total<0);
  $('#weekTotalLab').textContent=(selWeek===cur?'本週合計':'當週合計');
  if(todayHdr)requestAnimationFrame(()=>todayHdr.scrollIntoView({block:'nearest'}));
}

/* ========= 報表 ========= */
let repPer='month';

const PIE_COLORS=['#C9A176','#D3A593','#A8B5A0','#B9A6C0','#D9C7A3','#9FB6C3','#C7A3A3','#8FA98F'];

function periodFilter(){
  const y=today.getFullYear(),m=today.getMonth();
  if(repPer==='day'){const ds=fmtD(today);return{label:(m+1)+'/'+today.getDate()+' 當日',test:r=>r.date===ds};}
  if(repPer==='year'){const p=y+'-';return{label:y+'年',test:r=>r.date.startsWith(p)};}
  const p=y+'-'+pad(m+1);return{label:y+'年'+(m+1)+'月',test:r=>r.date.startsWith(p)};
}

function pieSVG(data,size){
  size=size||170;
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total<=0)return '<div class="empty" style="color:var(--brown-soft);font-size:13px;padding:18px 0">此期間尚無資料</div>';
  const cx=size/2,cy=size/2,R=size/2-2,r=R*0.55;
  let a0=-Math.PI/2, paths='';
  const nz=data.filter(d=>d.value>0);
  if(nz.length===1){
    paths='<circle cx="'+cx+'" cy="'+cy+'" r="'+((R+r)/2)+'" fill="none" stroke="'+nz[0].color+'" stroke-width="'+(R-r)+'"/>';
  }else{
    data.forEach(d=>{
      if(d.value<=0)return;
      const a1=a0+d.value/total*2*Math.PI;
      const large=(a1-a0)>Math.PI?1:0;
      const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0);
      const x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
      const x2=cx+r*Math.cos(a1),y2=cy+r*Math.sin(a1);
      const x3=cx+r*Math.cos(a0),y3=cy+r*Math.sin(a0);
      paths+='<path d="M'+x0.toFixed(2)+' '+y0.toFixed(2)+
        ' A'+R+' '+R+' 0 '+large+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+
        ' L'+x2.toFixed(2)+' '+y2.toFixed(2)+
        ' A'+r+' '+r+' 0 '+large+' 0 '+x3.toFixed(2)+' '+y3.toFixed(2)+
        ' Z" fill="'+d.color+'"/>';
      a0=a1;
    });
  }
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img">'+paths+'</svg>';
}
function legendHTML(data,total){
  return '<div class="legend">'+data.map(d=>{
    const pct=total>0?Math.round(d.value/total*100):0;
    return '<div class="lg"><i style="background:'+d.color+'"></i>'+esc(d.label)+'<b>'+money(d.value)+'（'+pct+'%）</b></div>';
  }).join('')+'</div>';
}

function renderRep(){
  const per=periodFilter();
  const rs=live().filter(per.test);
  const inSum=rs.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
  const exSum=rs.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);

  /* 收支圓餅 */
  $('#repPieTitle').textContent=per.label+'・收支圓餅圖';
  const pieData=[{label:'收入',value:inSum,color:'#C9A176'},{label:'支出',value:exSum,color:'#D3A593'}];
  $('#repPie').innerHTML=pieSVG(pieData)+( (inSum+exSum)>0 ? legendHTML(pieData,inSum+exSum)+
    '<div style="width:100%;text-align:center;font-size:13px;color:var(--brown-soft)">淨額 <b style="color:'+(inSum-exSum<0?'var(--red)':'var(--brown)')+';font-size:16px">'+money(inSum-exSum)+'</b></div>' : '');

  /* 客單價 */
  const visits=rs.filter(r=>r.type==='income').length;
  const avg=visits?Math.round(inSum/visits):0;
  $('#repAvg').innerHTML=
    '<div class="kpi"><span class="big">'+money(avg)+'</span><span class="unit">/ 人（'+esc(per.label)+'）</span></div>'+
    '<div class="kpi-sub"><span>總收入 <b>'+money(inSum)+'</b></span><span>來客數 <b>'+visits+' 位</b></span></div>';

  /* 服務佔比 */
  const svcMap={};
  rs.forEach(r=>{
    if(r.type!=='income')return;
    const name=r.breakdown&&r.breakdown.base?r.breakdown.base.name:'其他';
    svcMap[name]=(svcMap[name]||0)+r.amount;
  });
  const svcData=Object.keys(svcMap).map((k,i)=>({label:k,value:svcMap[k],color:PIE_COLORS[i%PIE_COLORS.length]}))
    .sort((a,b)=>b.value-a.value);
  const svcTotal=svcData.reduce((s,d)=>s+d.value,0);
  $('#repSvc').innerHTML=pieSVG(svcData)+(svcTotal>0?legendHTML(svcData,svcTotal):'');

  /* 客流量長條圖（當年每月來客數） */
  const y=today.getFullYear();
  const counts=Array(12).fill(0);
  live().forEach(r=>{
    if(r.type!=='income')return;
    if(r.date.slice(0,4)!=String(y))return;
    counts[parseInt(r.date.slice(5,7),10)-1]++;
  });
  const max=Math.max.apply(null,counts.concat([1]));
  const W=320,H=150,bw=W/12;
  let bars='';
  counts.forEach((c,i)=>{
    const h=c/max*(H-34);
    const x=i*bw+4, yb=H-22-h;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+yb.toFixed(1)+'" width="'+(bw-8).toFixed(1)+'" height="'+Math.max(h,1.5).toFixed(1)+'" rx="5" fill="'+(i===today.getMonth()?'#A87E52':'#E2CDB4')+'"/>'+
      (c>0?'<text x="'+(x+(bw-8)/2).toFixed(1)+'" y="'+(yb-4).toFixed(1)+'" text-anchor="middle" font-size="9" fill="#8A7560">'+c+'</text>':'')+
      '<text x="'+(x+(bw-8)/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#A08C77">'+(i+1)+'月</text>';
  });
  $('#repBars').innerHTML='<svg width="100%" viewBox="0 0 '+W+' '+H+'" role="img">'+bars+'</svg>';

  /* 常客排行（全期間累積） */
  const vipMap={};
  live().forEach(r=>{
    if(r.type!=='income')return;
    let name=r.customer||'';
    if(!name&&r.note){const m=/客人：([^・]+)/.exec(r.note);if(m)name=m[1].trim();}
    if(!name)return;
    if(!vipMap[name])vipMap[name]={n:0,sum:0,last:''};
    vipMap[name].n++; vipMap[name].sum+=r.amount;
    if(r.date>vipMap[name].last)vipMap[name].last=r.date;
  });
  const vips=Object.keys(vipMap).map(k=>({name:k,...vipMap[k]}))
    .sort((a,b)=>b.n-a.n||b.sum-a.sum).slice(0,8);
  const medals=['🥇','🥈','🥉'];
  $('#repVip').innerHTML=vips.length
    ? vips.map((v,i)=>
        '<div style="display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px">'+
        '<span style="width:26px;text-align:center">'+(medals[i]||(i+1))+'</span>'+
        '<span style="flex:1;font-weight:700">'+esc(v.name)+'</span>'+
        '<span style="color:var(--brown-soft);font-size:12px">'+v.n+' 次</span>'+
        '<span style="font-weight:700;color:var(--accent-deep)">'+money(v.sum)+'</span>'+
        '</div>').join('')
    : '<div class="empty" style="color:var(--brown-soft);font-size:13px;text-align:center;padding:14px 0">還沒有資料——用「預約 → 結帳」記下的收入會自動帶客人名字進來 💖</div>';
}

/* 24H 制、分鐘 10 分間隔的時間選擇器 */
function timeSelects(val,onChange){
  const wrap=document.createElement('span');
  wrap.style.cssText='display:inline-flex;gap:4px;align-items:center';
  const hs=document.createElement('select'); hs.className='inline-input'; hs.style.cssText='width:88px;text-align:center';
  const ms=document.createElement('select'); ms.className='inline-input'; ms.style.cssText='width:88px;text-align:center';
  let hOpts='<option value="">-- 時</option>';
  for(let h=0;h<24;h++)hOpts+='<option value="'+pad(h)+'">'+pad(h)+'</option>';
  hs.innerHTML=hOpts;
  const MINS=['00','10','20','30','40','50'];
  ms.innerHTML=MINS.map(m=>'<option value="'+m+'">'+m+'</option>').join('');
  const m0=/^(\d{1,2}):(\d{2})$/.exec(val||'');
  if(m0){
    hs.value=pad(+m0[1]);
    if(!MINS.includes(m0[2]))ms.innerHTML+='<option value="'+m0[2]+'">'+m0[2]+'</option>';
    ms.value=m0[2];
  }
  const colon=document.createElement('b'); colon.textContent='：';
  const upd=()=>onChange(hs.value===''?'':hs.value+':'+ms.value);
  hs.onchange=upd; ms.onchange=upd;
  wrap.appendChild(hs); wrap.appendChild(colon); wrap.appendChild(ms);
  return wrap;
}

const saveSched=()=>{saveOpts();scheduleSync();};
const dayCfg=ds=>opts.sched.days[ds]||null;
const isOffDay=ds=>{const c=dayCfg(ds);return !!(c&&c.off);};
function effSlots(ds){
  const c=dayCfg(ds);
  if(c&&c.off)return [];
  if(c&&c.slots)return c.slots.slice().sort();
  return opts.sched.slots.slice().sort();
}

function resetForms(){
  inSel={base:null,addons:[],extra:'',removal:null,freeRemoval:false,pct:null,fixed:null,custom:'',note:'',customer:''};
  exSel={cat:Object.keys(opts.expCats)[0],items:[],other:'',note:''};
  bkSel={name:'',time:'',channel:'',channelOther:'',plans:[],planNote:'',deposit:''};
  calcExpr='';
}

function openEntry(rec){
  editingId=rec?rec.id:null;
  editDate=rec?rec.date:selDate;
  if(rec){
    entryMode=rec.type;
    if(rec.type==='income')prefillIncome(rec);
    else if(rec.type==='expense')prefillExpense(rec);
    else prefillBooking(rec);
  }else{
    entryMode='income';
    resetForms();
  }
  const d=new Date(editDate+'T00:00:00');
  $('#entryDate').textContent=(editingId?'✏️ 編輯紀錄：':'記帳日期：')+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）';
  renderSeg(); renderEntryBody();
  $('#entryMask').classList.add('show'); $('#entrySheet').classList.add('show');
}

/* 預約 → 結帳：打開收入表單並帶入客人資訊，存檔後原預約直接轉成收入紀錄 */
function openCheckout(bk){
  editingId=bk.id;
  editDate=bk.date;
  entryMode='income';
  resetForms();
  const plans=bk.plans||(bk.plan?[bk.plan]:[]);
  plans.forEach(p=>{
    const b=opts.base.find(o=>o.name===p.name);
    if(b&&!inSel.base){inSel.base=b;return;}
    const a=opts.addon.find(o=>o.name===p.name);
    if(a&&!inSel.addons.some(x=>x.id===a.id)){inSel.addons.push(a);return;}
    const rm=opts.removal.find(o=>o.name===p.name);
    if(rm&&!inSel.removal){inSel.removal=rm;return;}
    /* 對不到清單的項目也要算進金額 */
    inSel.addons.push({id:'x_'+uid(),name:p.name,price:p.price});
  });
  inSel.customer=bk.name;
  const parts=['客人：'+bk.name];
  if(bk.channel)parts.push(bk.channel+'預約');
  if(bk.deposit>0)parts.push('訂金已付$'+bk.deposit);
  if(bk.planNote)parts.push(bk.planNote);
  inSel.note=parts.join('・');
  const d=new Date(bk.date+'T00:00:00');
  $('#entryDate').textContent='💰 '+bk.name+' 結帳：'+(d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）';
  renderSeg(); renderEntryBody();
  $('#entryMask').classList.add('show'); $('#entrySheet').classList.add('show');
}

/* 把既有預約還原成表單狀態 */
function prefillBooking(r){
  resetForms();
  const ch=r.channel||'';
  bkSel={
    name:r.name||'',
    time:r.time||'',
    channel:BK_CHANNELS.includes(ch)?ch:'',
    channelOther:BK_CHANNELS.includes(ch)?'':ch,
    plans:(r.plans||(r.plan?[r.plan]:[])).map(p=>
      opts.bookSvc.find(o=>o.name===p.name&&o.price===p.price)||
      opts.bookSvc.find(o=>o.name===p.name)||
      {id:'x_'+uid(),name:p.name,price:p.price}
    ),
    planNote:r.planNote||'',
    deposit:r.deposit>0?String(r.deposit):''
  };
}

/* 把既有收入紀錄還原成表單狀態 */
function prefillIncome(r){
  const bd=r.breakdown||{};
  const findBy=(arr,it)=>arr.find(o=>o.name===it.name&&o.price===it.price)||arr.find(o=>o.name===it.name);
  inSel={base:null,addons:[],extra:'',removal:null,freeRemoval:false,pct:null,fixed:null,custom:'',note:r.note||'',customer:r.customer||''};
  exSel={cat:Object.keys(opts.expCats)[0],items:[],other:'',note:''};
  calcExpr='';
  if(bd.base)inSel.base=findBy(opts.base,bd.base)||{id:'x_'+uid(),name:bd.base.name,price:bd.base.price};
  (bd.addons||[]).forEach(a=>{
    if(a.name==='款式加價'){inSel.extra=String(a.price);return;}
    inSel.addons.push(findBy(opts.addon,a)||{id:'x_'+uid(),name:a.name,price:a.price});
  });
  if(bd.removal){
    const m=findBy(opts.removal,bd.removal);
    inSel.removal=m||{id:'x_'+uid(),name:bd.removal.name,price:bd.removal.price};
  }
  if(r.discount){
    if(r.discount.pct)inSel.pct=r.discount.pct;
    if(r.discount.fixed)inSel.fixed=r.discount.fixed;
    if(r.discount.custom)inSel.custom=String(r.discount.custom);
    if(/新客免費卸甲/.test(r.discount.label||''))inSel.freeRemoval=true;
  }
}

/* 把既有支出紀錄還原成表單狀態 */
function prefillExpense(r){
  const cat=opts.expCats[r.category]?r.category:Object.keys(opts.expCats)[0];
  const known=opts.expCats[cat]||[];
  const items=[],others=[];
  (r.items||[]).forEach(n=>known.includes(n)?items.push(n):others.push(n));
  inSel={base:null,addons:[],extra:'',removal:null,freeRemoval:false,pct:null,fixed:null,custom:'',note:'',customer:''};
  exSel={cat:cat,items:items,other:others.join('、'),note:r.note||''};
  calcExpr=String(r.amount);
}

function chipBtn(label,price,on,cb,exStyle){
  const b=document.createElement('button');
  b.className='chip'+(on?(exStyle?' ex-on':' on'):'');
  b.innerHTML=esc(label)+(price!=null?'<small>$'+price+'</small>':'');
  b.onclick=cb;
  return b;
}
function blk(title){
  const d=document.createElement('div'); d.className='blk';
  d.innerHTML='<div class="blk-t">'+esc(title)+'</div>';
  const c=document.createElement('div'); c.className='chips'; d.appendChild(c);
  return {wrap:d,chips:c};
}

function incomeTotal(){
  let sub=0;
  if(inSel.base)sub+=inSel.base.price;
  inSel.addons.forEach(a=>sub+=a.price);
  const ex=parseFloat(inSel.extra);
  if(!isNaN(ex)&&ex>0)sub+=ex;
  if(inSel.removal&&!inSel.freeRemoval)sub+=inSel.removal.price;
  let t=sub;
  if(inSel.pct)t=t*inSel.pct;
  if(inSel.fixed)t-=inSel.fixed;
  const c=parseFloat(inSel.custom);
  if(!isNaN(c)&&c>0)t-=c;
  return Math.max(0,Math.round(t));
}
function calcTotal(){
  if(!calcExpr)return 0;
  const tokens=calcExpr.match(/\d+(?:\.\d+)?|[+\-]/g)||[];
  let total=0,op='+';
  tokens.forEach(t=>{
    if(t==='+'||t==='-'){op=t;return;}
    const n=parseFloat(t);
    total=op==='+'?total+n:total-n;
  });
  return Math.round(total*100)/100;
}

function updateFoot(){
  const lab=$('#footLab'),val=$('#footVal'),ok=$('#okBtn');
  if(entryMode==='income'){
    lab.textContent='顧客支付金額';
    val.textContent=money(incomeTotal());
    val.classList.remove('ex'); ok.classList.remove('ex');
    ok.disabled=!inSel.base;
  }else if(entryMode==='expense'){
    lab.textContent='本筆採購總費用';
    val.textContent=money(calcTotal());
    val.classList.add('ex'); ok.classList.add('ex');
    ok.disabled=calcTotal()<=0;
  }else{
    const dep=parseFloat(bkSel.deposit);
    lab.textContent='已收訂金（沒收可留空）';
    val.textContent=(!isNaN(dep)&&dep>0)?money(dep):'—';
    val.classList.remove('ex'); ok.classList.remove('ex');
    ok.disabled=!bkSel.name.trim();
  }
}

function renderEntryBody(){
  const body=$('#entryBody'); body.innerHTML='';
  if(entryMode==='income')renderIncome(body);
  else if(entryMode==='expense')renderExpense(body);
  else renderBooking(body);
  updateFoot();
}

/* ---- 預約頁 ---- */
function renderBooking(body){
  /* 客人名字 */
  const b0=blk('客人名字（必填）');
  const ni=document.createElement('input');
  ni.type='text'; ni.placeholder='例：布丁狗'; ni.className='inline-input wide'; ni.value=bkSel.name;
  ni.oninput=()=>{bkSel.name=ni.value;updateFoot();};
  b0.chips.appendChild(ni);
  body.appendChild(b0.wrap);

  /* 預約時間 */
  const b1=blk('預約時間（24小時制）');
  b1.chips.appendChild(timeSelects(bkSel.time,v=>{bkSel.time=v;}));
  body.appendChild(b1.wrap);

  /* 預約管道 */
  const b2=blk('預約管道');
  BK_CHANNELS.forEach(ch=>{
    b2.chips.appendChild(chipBtn(ch,null,bkSel.channel===ch,()=>{
      bkSel.channel=bkSel.channel===ch?'':ch;
      if(bkSel.channel)bkSel.channelOther='';
      renderEntryBody();
    }));
  });
  const oi=document.createElement('input');
  oi.type='text'; oi.placeholder='其他管道（自行輸入）'; oi.className='inline-input'; oi.value=bkSel.channelOther;
  oi.oninput=()=>{bkSel.channelOther=oi.value;if(oi.value)bkSel.channel='';};
  b2.chips.appendChild(oi);
  body.appendChild(b2.wrap);

  /* 預計做的服務（複選） */
  const b3=blk('預計做的服務（可複選，結帳時會自動帶入）');
  opts.bookSvc.forEach(o=>{
    const on=bkSel.plans.some(p=>p.id===o.id);
    b3.chips.appendChild(chipBtn(o.name,o.price,on,()=>{
      if(on)bkSel.plans=bkSel.plans.filter(p=>p.id!==o.id);
      else bkSel.plans.push(o);
      renderEntryBody();
    }));
  });
  bkSel.plans.filter(p=>!opts.bookSvc.some(o=>o.id===p.id)).forEach(p=>{
    b3.chips.appendChild(chipBtn(p.name+'（清單外）',p.price,true,()=>{
      bkSel.plans=bkSel.plans.filter(x=>x.id!==p.id); renderEntryBody();
    }));
  });
  const pi=document.createElement('input');
  pi.type='text'; pi.placeholder='款式細節、客人需求…'; pi.className='inline-input wide'; pi.value=bkSel.planNote;
  pi.oninput=()=>{bkSel.planNote=pi.value;};
  b3.chips.appendChild(pi);
  body.appendChild(b3.wrap);

  /* 訂金 */
  const b4=blk('訂金');
  const di=document.createElement('input');
  di.type='number'; di.inputMode='numeric'; di.placeholder='已收訂金金額（沒收留空）'; di.className='inline-input'; di.style.width='200px'; di.value=bkSel.deposit;
  di.oninput=()=>{bkSel.deposit=di.value;updateFoot();};
  b4.chips.appendChild(di);
  body.appendChild(b4.wrap);

  /* 後台設定區 */
  body.appendChild(buildBookAdmin());
}

/* ---- 收入頁 ---- */
function renderIncome(body){
  /* 基礎服務（單選） */
  const b1=blk('基礎服務（單選）');
  opts.base.forEach(o=>{
    b1.chips.appendChild(chipBtn(o.name,o.price,inSel.base&&inSel.base.id===o.id,()=>{
      inSel.base=(inSel.base&&inSel.base.id===o.id)?null:o;
      renderEntryBody();

  body.appendChild(bn.wrap);

  /* 計算機 */
  const cw=document.createElement('div'); cw.className='blk';
  cw.innerHTML='<div class="blk-t">金額（可加減）</div>';
  const calc=document.createElement('div'); calc.className='calc';
  const disp=document.createElement('div'); disp.className='calc-disp';
  const renderDisp=()=>{disp.innerHTML=calcExpr?esc(calcExpr):'<span class="ph">輸入金額，可用＋－累加多筆</span>';updateFoot();};
  renderDisp();
  const keys=document.createElement('div'); keys.className='calc-keys';
  [['7'],['8'],['9'],['＋','op','+'],
   ['4'],['5'],['6'],['－','op','-'],
   ['1'],['2'],['3'],['⌫','op','bs'],
   ['0'],['00'],['.'],['Ｃ','danger','c']
  ].forEach(([label,cls,act])=>{
    const k=document.createElement('button');
    if(cls)k.className=cls;
    k.textContent=label;
    k.onclick=()=>{
      const a=act||label;
      if(a==='c'){calcExpr='';}
      else if(a==='bs'){calcExpr=calcExpr.slice(0,-1);}
      else if(a==='+'||a==='-'){
        if(!calcExpr)return;
        const last=calcExpr.slice(-1);
        if(last==='+'||last==='-')calcExpr=calcExpr.slice(0,-1)+a;
        else if(last==='.')return;
        else calcExpr+=a;
      }else if(a==='.'){
        const seg=calcExpr.split(/[+\-]/).pop();
        if(seg.includes('.'))return;
        calcExpr+=seg===''?'0.':'.';
      }else{
        const seg=calcExpr.split(/[+\-]/).pop();
        if(seg.replace('.','').length>=8)return;
        calcExpr+=a;
      }
      renderDisp();
    };
    keys.appendChild(k);
  });
  calc.appendChild(disp); calc.appendChild(keys); cw.appendChild(calc);
  body.appendChild(cw);

  /* 後台設定區 */
  body.appendChild(buildExpAdmin());
}

    if(bkSel.time){

      const myMin=toMin(bkSel.time);

      );
      if(near.length){

        if(!confirm('⚠️ 注意撞單：當天已有「'+who+'」的預約，時間很接近，仍要儲存嗎？'))return;
      }
    }
    const dep=parseFloat(bkSel.deposit);
    save({
      type:'booking', date:editDate,
      name:bkSel.name.trim(),
      time:bkSel.time||'',
      channel:bkSel.channel||bkSel.channelOther.trim(),
      plans:bkSel.plans.map(p=>({name:p.name,price:p.price})),

      deposit:(!isNaN(dep)&&dep>0)?dep:0
    });

  }

/* ===== IG 預約表圖片產生器（1080×1920，9:16 直式） ===== */
const LS_SCHEDBG='pp_schedbg';
let schedBg=localStorage.getItem(LS_SCHEDBG)||'';

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawCover(ctx,img,W,H){
  const k=Math.max(W/img.width,H/img.height);
  const w=img.width*k,h=img.height*k;
  ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
}
/* 該日已被預約走的時段（預約時間對到最近 90 分鐘內的時段） */
function takenSlots(ds,slots){
  const toMin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t);return m?(+m[1])*60+(+m[2]):null;};
  const taken=new Set();
  live().filter(r=>r.type==='booking'&&r.date===ds&&r.time).forEach(b=>{
    const bm=toMin(b.time); if(bm==null)return;
    let best=null,bd=1e9;
    slots.forEach(sl=>{const d=Math.abs(toMin(sl)-bm);if(d<bd){bd=d;best=sl;}});
    if(best!=null&&bd<90)taken.add(best);
  });
  return taken;
}

function genSchedule(y,m){
  const btn=$('#schedBtn');
  btn.disabled=true; btn.textContent='產生圖片中…';
  const W=1080,H=1920;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  const done=ok=>{
    btn.disabled=false; btn.textContent='🖼️ 產生本月 IG 預約表';
    if(ok)toast('已產生 '+(m+1)+'月預約表 🖼️');
  };
  const drawBody=hasImg=>{
    try{
      const fam=(theme.font&&theme.font!=='system')?'"'+theme.font+'",':'';
      const FONT=fam+'"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
      /* 標題 */
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      if(hasImg){ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=14;ctx.fillStyle='#FFFFFF';}
      else ctx.fillStyle='#5C4633';
      ctx.font='400 40px '+FONT;
      ctx.fillText(String(y),W/2,166);
      ctx.font='800 88px '+FONT;
      ctx.fillText('Puli puli '+(m+1)+'月預約',W/2,268);
      ctx.shadowBlur=0;

      /* 計算格子 */
      const first=new Date(y,m,1);
      const offset=(first.getDay()+6)%7;          /* 週一開頭 */
      const days=new Date(y,m+1,0).getDate();
      const rows=Math.ceil((offset+days)/7);
      const slotsByDay={}; let maxSl=0;
      for(let d=1;d<=days;d++){
        const ds=y+'-'+pad(m+1)+'-'+pad(d);
        const sl=effSlots(ds);
        slotsByDay[d]=sl;
        if(sl.length>maxSl)maxSl=sl.length;
      }
      maxSl=Math.max(maxSl,1);
      const footerLines=(opts.sched.footer||'').split('\n').filter(x=>x.trim());

      const px=64,pw=W-128,py=330;
      const headH=64;
      let rowH=66+maxSl*42;
      const footH=footerLines.length?56+footerLines.length*44:20;
      let panelH=44+headH+rows*rowH+footH+30;
      const maxPanel=H-py-60;
      if(panelH>maxPanel){
        rowH=Math.max(96,Math.floor((maxPanel-44-headH-footH-30)/rows));
        panelH=44+headH+rows*rowH+footH+30;
      }
      /* 白色面板 */
      ctx.fillStyle=hasImg?'rgba(255,255,255,.86)':'rgba(255,255,255,.66)';
      rr(ctx,px,py,pw,panelH,36); ctx.fill();

      const gx=px+34, gw=pw-68, colW=gw/7;
      const gy=py+44;
      /* 星期列 */
      ctx.fillStyle='#A08C77'; ctx.font='700 26px '+FONT;
      ['MON','TUE','WED','THU','FRI','SAT','SUN'].forEach((t,i)=>{
        ctx.fillText(t,gx+i*colW+colW/2,gy+34);
      });
      /* 分隔線 */
      ctx.strokeStyle='rgba(160,140,119,.35)'; ctx.lineWidth=2;
      for(let r0=0;r0<=rows;r0++){
        const ly=gy+headH+r0*rowH;
        ctx.beginPath();ctx.moveTo(gx,ly);ctx.lineTo(gx+gw,ly);ctx.stroke();
      }
      for(let c0=1;c0<7;c0++){
        ctx.beginPath();ctx.moveTo(gx+c0*colW,gy+headH);ctx.lineTo(gx+c0*colW,gy+headH+rows*rowH);ctx.stroke();
      }
      /* 每一天 */
      const slotFit=Math.floor((rowH-58)/40);
      for(let d=1;d<=days;d++){
        const r0=Math.floor((offset+d-1)/7), c0=(offset+d-1)%7;
        const cx=gx+c0*colW+colW/2;
        const cy=gy+headH+r0*rowH;
        const ds=y+'-'+pad(m+1)+'-'+pad(d);
        ctx.fillStyle='#7A6450'; ctx.font='700 28px '+FONT;
        ctx.fillText(String(d),cx,cy+38);
        const sl=slotsByDay[d];
        if(isOffDay(ds)){
          ctx.fillStyle='#C9A176'; ctx.font='400 24px '+FONT;
          ctx.fillText('休',cx,cy+78);
          continue;
        }
        const taken=takenSlots(ds,sl);
        sl.slice(0,Math.max(slotFit,1)).forEach((t,i)=>{
          const sy=cy+58+i*40;
          if(taken.has(t)){
            ctx.fillStyle='#E8D5B8';
            rr(ctx,cx-(colW-30)/2,sy-6,colW-30,30,15); ctx.fill();
          }else{
            ctx.fillStyle='#5C4633'; ctx.font='400 27px '+FONT;
            ctx.fillText(t,cx,sy+16);
          }
        });
      }
      /* 底部說明文字 */
      if(footerLines.length){
        ctx.textAlign='left';
        let fy=gy+headH+rows*rowH+58;
        footerLines.forEach((line,i)=>{
          ctx.fillStyle=i===0?'#5C4633':'#7A6450';
          ctx.font=(i===0?'700 30px ':'400 26px ')+FONT;
          ctx.fillText(line,gx+10,fy);
          fy+=44;
        });
      }
      /* 輸出 */
      const a=document.createElement('a');
      a.href=cv.toDataURL('image/png');
      a.download='pulipuli-'+y+'-'+pad(m+1)+'-預約表.png';
      a.click();
      done(true);
    }catch(e){done(false);toast('產生失敗，請再試一次');}
  };
  const start=()=>{
    if(schedBg){
      const img=new Image();
      img.onload=()=>{drawCover(ctx,img,W,H);drawBody(true);};
      img.onerror=()=>{paintDefault();drawBody(false);};
      img.src=schedBg;
    }else{paintDefault();drawBody(false);}
  };
  if(theme.font&&theme.font!=='system'&&document.fonts&&document.fonts.load){
    ensureFontCss();
    Promise.all([
      document.fonts.load('400 27px "'+theme.font+'"','預約'),
      document.fonts.load('800 88px "'+theme.font+'"','預約')
    ]).then(start).catch(start);
  }else start();

  function paintDefault(){
    ctx.fillStyle=theme.color||THEME_DEFAULT_COLOR;
    ctx.fillRect(0,0,W,H);
    /* 可愛的柔色圓點裝飾 */
    const deco=[[120,140,90],[940,120,70],[180,1750,110],[900,1800,85],[70,900,60],[1010,1000,65],[540,60,45],[990,1860,40],[60,1500,50]];
    const cols=['#C9A176','#D3A593','#A8B5A0','#B9A6C0','#D9C7A3'];
    deco.forEach((p,i)=>{
      ctx.globalAlpha=.18;
      ctx.fillStyle=cols[i%cols.length];
      ctx.beginPath();ctx.arc(p[0],p[1],p[2],0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
  }
}

/* ========= GitHub Gist 同步引擎 ========= */
const GIST_FILE='pulipuli-data.json';
let syncTimer=null, syncing=false;
function scheduleSync(){
  if(!syncCfg.token)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncNow(false),2000);
}
function gh(method,path,bodyObj){
  return fetch('https://api.github.com'+path,{
    method:method,
    headers:{
      'Authorization':'Bearer '+syncCfg.token,
      'Accept':'application/vnd.github+json',
      'Content-Type':'application/json'
    },
    body:bodyObj?JSON.stringify(bodyObj):undefined
  });
}
function mergeRecords(a,b){
  const map={};
  a.concat(b).forEach(r=>{
    if(!r||!r.id)return;
    const old=map[r.id];
    if(!old||(r.updatedAt||0)>(old.updatedAt||0))map[r.id]=r;
  });
  return Object.values(map);
}
function setSyncUI(state,msg){
  const dot=$('#syncDot');
  dot.className='sync-dot '+(state||'');
  const st=$('#syncStatus');
  if(st){
    const ic=state==='ok'?'🟢':state==='busy'?'🟡':state==='err'?'🔴':'⚪️';
    st.innerHTML=ic+' '+esc(msg||'');
  }
}
function refreshSyncStatus(){
  if(!syncCfg.token)setSyncUI('','尚未連線（純單機模式，資料只存在這台裝置）');
  else if(syncCfg.last)setSyncUI('ok','上次同步：'+new Date(syncCfg.last).toLocaleString('zh-TW',{hour12:false}));
  else setSyncUI('','已設定權杖，尚未同步');
}
async function syncNow(manual){
  if(!syncCfg.token){if(manual)toast('請先在設定貼上 GitHub 權杖');return;}
  if(syncing)return;
  syncing=true;
  setSyncUI('busy','同步中…');
  try{
    let remote=null;
    /* 下載 */
    if(syncCfg.gistId){
      const res=await gh('GET','/gists/'+syncCfg.gistId);
      if(res.status===404){syncCfg.gistId='';saveSync();}
      else if(res.ok){
        const g=await res.json();
        const f=g.files&&g.files[GIST_FILE];
        if(f){
          let content=f.content;
          if(f.truncated){const raw=await fetch(f.raw_url);content=await raw.text();}
          try{remote=JSON.parse(content);}catch(e){remote=null;}
        }
      }else throw new Error('讀取失敗 '+res.status);
    }
    if(!syncCfg.gistId){
      /* 尋找既有的 Gist（換裝置時自動接回同一份資料） */
      const ls=await gh('GET','/gists?per_page=100');
      if(ls.ok){
        const arr=await ls.json();
        const hit=arr.find(g=>g.files&&g.files[GIST_FILE]);
        if(hit){
          syncCfg.gistId=hit.id; saveSync();
          const res=await gh('GET','/gists/'+hit.id);
          if(res.ok){
            const g=await res.json();
            const f=g.files[GIST_FILE];
            let content=f.content;
            if(f.truncated){const raw=await fetch(f.raw_url);content=await raw.text();}
            try{remote=JSON.parse(content);}catch(e){remote=null;}
          }
        }
      }else throw new Error('權杖無效（'+ls.status+'）');
    }
    /* 合併 */
    if(remote){
      records=mergeRecords(records,remote.records||[]);
      if(remote.opts&&(remote.opts.updatedAt||0)>(opts.updatedAt||0)){opts=remote.opts;ensureSched();}
      saveRecords(); localStorage.setItem(LS_OPT,JSON.stringify(opts));
    }
    /* 上傳 */
    const payload=JSON.stringify({records:records,opts:opts,syncedAt:new Date().toISOString()},null,1);
    if(!syncCfg.gistId){
      const res=await gh('POST','/gists',{
        description:'PuliPuli.Studio 記帳資料（自動同步，請勿手動修改）',
        public:false,
        files:{[GIST_FILE]:{content:payload}}
      });
      if(!res.ok)throw new Error('建立雲端備份失敗 '+res.status);
      const g=await res.json();
      syncCfg.gistId=g.id;
    }else{
      const res=await gh('PATCH','/gists/'+syncCfg.gistId,{files:{[GIST_FILE]:{content:payload}}});
      if(!res.ok)throw new Error('上傳失敗 '+res.status);
    }
    syncCfg.last=Date.now(); saveSync();
    setSyncUI('ok','上次同步：'+new Date(syncCfg.last).toLocaleString('zh-TW',{hour12:false}));
    if(manual)toast('同步完成 ☁️');
    if(curPage==='cal')renderCal();
    if(curPage==='rec')renderRec();
    if(curPage==='rep')renderRep();
  }catch(e){
    setSyncUI('err','同步失敗：'+(e.message||'網路或權杖問題'));
    if(manual)toast('同步失敗，請檢查網路與權杖');
  }finally{
    syncing=false;
  }
}

/* ========= 啟動 ========= */
applyTheme();
renderCal();
if(syncCfg.token)syncNow(false);
else refreshSyncStatus();

</script>
